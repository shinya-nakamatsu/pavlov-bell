document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  if(act==="scrim"&&e.target!==t) return;
  try{
  switch(act){
    case "scrim": case "close": closeModal(); break;
    case "login-account":{
      const acc=findAccount(($("#sid")||{}).value,($("#spw")||{}).value);
      if(!acc){ toast("ログインIDかパスコードが違います"); break; }
      if(($("#srem")||{}).checked) rememberMe(acc.id); else rememberMe("");
      state.student=acc; state.view="student"; render(); break;}
    case "login-tab": state.loginTab=id; render(); break;
    case "login-me": state.student=Object.assign({id},mem.students[id]); state.view="student"; render(); break;
    case "forget-me": rememberMe(""); render(); break;
    case "login-teacher":{
      const pin=(mem.meta.config&&mem.meta.config.pin)||"1234";
      const v=($("#tpin")||{}).value||"";
      if(v===pin){ state.view="teacher"; state.teacherTab="students"; state.detail=null; render(); }
      else toast("パスコードが違います");
      break;}
    case "logout": stopSpeak(); stopListen(); stopMonitor(); state.view="login"; state.student=null; state.detail=null; state.session=null; render(); break;
    case "home": stopSpeak(); stopListen(); clearInterval(tvTimer); state.view="student"; state.session=null; state.tv=null; render(); break;
    case "voice-toggle": TTS.on=!TTS.on; saveVoice(); if(TTS.on){warmTTS();speak("Hello");} else stopSpeak(); render(); break;
    case "voice-rate": TTS.rate=parseFloat(t.dataset.v); saveVoice(); warmTTS(); speak("This is a sample sentence.",TTS.rate); render(); break;
    case "tab": state.teacherTab=id; state.detail=null; render(); break;
    case "detail": state.detail=id; render(); break;
    case "back": state.detail=null; render(); break;

    case "reload": try{ location.reload(); }catch(e){ toast("画面を閉じて開き直してください"); } break;
    case "iv-open": if(!SAMPLE){toast("この環境ではAI面接練習が使えません");break;} ivOpen(); break;
    case "iv-close": ivReset(); break;
    case "iv-start": if(!state.busy){state.busy=true; await ivGenerate(t.dataset.lv); state.busy=false;} break;
    case "iv-mic":{
      const V=state.iv; if(!V) break;
      if(V.rec&&V.rec.st==="live"){ stopListen(); break; }
      stopSpeak(); V.rec={st:"live",text:V.rec?V.rec.text:""}; render();
      listenOnce((txt)=>{ if(state.iv&&state.iv.rec){ const box=$("#ivans")||$("#ivread");
          state.iv.rec.text=txt; if(box) box.value=txt; } },
        (err,best)=>{ const W=state.iv; if(!W||!W.rec) return;
          if(err&&err!=="no-speech"){ W.rec={st:"idle",text:W.rec.text}; render();
            toast(ASR.blocked?"マイクが使えません。入力欄に英語で書いてください":"もう一度お試しください"); return; }
          W.rec={st:"idle",text:W.rec.text||best||""}; render(); });
      break;}
    case "iv-readdone":{
      const V=state.iv, box=$("#ivread"), txt=box?box.value.trim():"";
      if(txt) V.read=ivReadScore(V.data.passage,txt);
      V.rec={st:"idle",text:""}; V.step="qa"; V.idx=0; V.msg=""; micReset(); render();
      setTimeout(()=>{ if(state.iv&&state.iv.data) speak(state.iv.data.questions[0].q); },350);
      break;}
    case "iv-next":{
      const V=state.iv, box=$("#ivans");
      V.ans[V.idx]=box?box.value.trim():"";
      if(V.idx+1<V.data.questions.length){ V.idx++; V.rec={st:"idle",text:V.ans[V.idx]||""}; V.msg=""; micReset(); render();
        setTimeout(()=>{ if(state.iv) speak(state.iv.data.questions[state.iv.idx].q); },250); }
      else { if(!state.busy){ state.busy=true; await ivGrade(); state.busy=false; } }
      break;}
    case "iv-back":{ const V=state.iv, box=$("#ivans");
      V.ans[V.idx]=box?box.value.trim():""; V.idx=Math.max(0,V.idx-1);
      V.rec={st:"idle",text:V.ans[V.idx]||""}; render(); break;}
    case "iv-again":{ const lv=state.iv.lv; ivOpen(); if(!state.busy){state.busy=true; await ivGenerate(lv); state.busy=false;} break;}
    case "textbook": if(!SAMPLE){toast("この環境ではAI作成が使えません");break;}
      state.tbBook=state.tbBook||"NH"; state.tbGrade=state.tbGrade||"中2"; state.tbMake=state.tbMake||"both";
      openModal(mdTextbook()); break;
    case "tbsel": state.tbBook=t.dataset.k; openModal(mdTextbook()); break;
    case "tbmake": state.tbMake=t.dataset.k; openModal(mdTextbook()); break;
    case "tbgen":{
      if(state.busy) break;
      const T=TEXTBOOKS.find(x=>x.k===(state.tbBook||"NH"))||TEXTBOOKS[0];
      const gr=($("#tbg")||{}).value||"中2";
      const unit=(($("#tbu")||{}).value||"").trim();
      const text=(($("#tbtext")||{}).value||"").trim();
      const n=Math.max(5,Math.min(60,+(($("#tbn")||{}).value||25)));
      const make=state.tbMake||"both";
      if(text.length<40){ if($("#tbmsg")) $("#tbmsg").innerHTML='<span class="ng">本文をもう少し長く貼ってください（40文字以上）。</span>'; break; }
      const base=(T.k==="OT"?"":T.name+" ")+gr.replace("中","")+(unit?" "+unit:"");
      const lv=GRADE_LV[gr]||"4";
      state.busy=true;
      const setMsg=h=>{ const el=$("#tbmsg"); if(el) el.innerHTML=h; };
      try{
        let made=[];
        if(make==="word"||make==="both"){
          setMsg("単語を抜き出しています…（20秒ほど）");
          const out=await SAMPLE.json(
            `次は日本の中学校の英語教科書の本文です。ここから、${gr}の生徒が覚えるべき重要語を最大${n}語えらんで単語カードを作ってください。\n`+
            `--- 本文 ---\n${text}\n--- ここまで ---\n`+
            `固有名詞・人名・地名、および be動詞や a / the のような機能語は除くこと。本文に出てくる形ではなく原形（辞書形）で書くこと。\n`+
            `出力は JSON 配列のみ。各要素は {"q":"英単語(小文字)","a":"この本文での日本語の意味","ex":"本文中のその語を含む英文（なければ中学生向けの短い英文）","lv":"5|4|3|p2|2"}。`+
            `lv は英検の級の目安。説明文やコードフェンスは書かないこと。`,{modelTier:"default"});
          const arr=(Array.isArray(out)?out:(out&&out.items)||[]).filter(x=>x&&x.q&&x.a);
          if(!arr.length) throw new Error("単語を読み取れませんでした");
          const items=arr.map((x,i)=>({id:"w"+i+"_"+String(x.q).replace(/[^a-zA-Z0-9]/g,"").slice(0,14),
            q:String(x.q).trim(),a:String(x.a).trim(),ex:String(x.ex||"").trim(),lv:normLv(x.lv)||lv}));
          await Store.put("books",uid("bk_"),{title:base+" 単語",tag:"英語",kind:"word",
            textbook:T.name,grade:gr,unit,items,createdAt:Date.now(),ai:true});
          made.push(items.length+"語の単語帳");
        }
        if(make==="sentence"||make==="both"){
          setMsg("英文を切り出しています…（20秒ほど）");
          const out2=await SAMPLE.json(
            `次は日本の中学校の英語教科書の本文です。暗記練習用に、意味のまとまりごとの英文カードを作ってください。\n`+
            `--- 本文 ---\n${text}\n--- ここまで ---\n`+
            `本文の英文を、原則そのままの形で1文ずつ取り出すこと（勝手に書き換えない）。1文が20語を超える場合のみ自然な位置で分けてよい。\n`+
            `出力は JSON 配列のみ。各要素は {"q":"英文","a":"自然な日本語訳"}。説明文やコードフェンスは書かないこと。`,
            {modelTier:"default"});
          const arr2=(Array.isArray(out2)?out2:(out2&&out2.items)||[]).filter(x=>x&&x.q&&x.a);
          if(!arr2.length) throw new Error("英文を読み取れませんでした");
          const items2=arr2.map((x,i)=>({id:"s"+i,q:String(x.q).trim(),a:String(x.a).trim(),ex:"",lv}));
          await Store.put("books",uid("bk_"),{title:base+" 文章暗記",tag:"英語",kind:"sentence",
            textbook:T.name,grade:gr,unit,items:items2,createdAt:Date.now(),ai:true});
          made.push(items2.length+"文の文章暗記帳");
        }
        closeModal(); toast(made.join(" と ")+"を作成しました");
      }catch(err){
        const m=aiErrMsg(err);
        setMsg(m==="GRANT"?aiGrantCard():`<span class="ng">${esc(m)}</span>`);
      }finally{ state.busy=false; }
      break;}
    case "booktest": state.tBook=id; state.tMode="live"; state.teacherTab="tests"; openModal(mdTest()); break;
    case "newtest": if(!books().length){toast("先に教材を作成してください");break;}
      state.tBook=books()[0].id; state.tMode="live"; openModal(mdTest()); break;
    case "tmode": state.tMode=t.dataset.m; openModal(mdTest()); break;
    case "test-save":{
      const bid=($("#tb")||{}).value, b=getBook(bid);
      if(!b){toast("教材を選んでください");break;}
      const lv=($("#tlv")||{}).value||"", un=($("#tu")||{}).value||"";
      let pool=b.items.filter(i=>(!lv||lvOf(i)===lv)&&(!un||unitOf(i)===un));
      if(pool.length<3){toast("この条件では問題が足りません");break;}
      const n=Math.max(3,Math.min(60,+(($("#tn")||{}).value||20),pool.length));
      pool=pool.slice(); for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
      const mode=state.tMode||"live";
      await Store.put("tests",uid("ts_"),{
        title:(($("#tt")||{}).value||"").trim()||"単語テスト",
        bookId:bid, lv, unit:un, format:($("#tf")||{}).value||"mc",
        itemIds:pool.slice(0,n).map(i=>i.id),
        mode, limitMin:mode==="live"?Math.max(1,+(($("#tl")||{}).value||10)):0,
        due:mode==="assign"?(($("#td")||{}).value||""):"",
        studentIds:[...document.querySelectorAll(".tst:checked")].map(c=>c.value),
        reflect:!!(($("#tr")||{}).checked), open:false, closedAt:0, createdAt:Date.now()});
      closeModal(); toast("テストを作成しました"); break;}
    case "test-open":{ const x=mem.tests[id]; if(!x)break;
      await Store.put("tests",id,Object.assign({},x,{open:true,closedAt:0,startedAt:Date.now()}));
      toast("テストを開始しました"); render(); break;}
    case "test-close":{ const x=mem.tests[id]; if(!x)break;
      await Store.put("tests",id,Object.assign({},x,{open:false,closedAt:Date.now()}));
      toast("テストを終了しました"); render(); break;}
    case "test-del": if(confirm("このテストと結果を削除しますか？")){
        for(const k of Object.keys(mem.results||{})) if(k.startsWith(id+"__")) await Store.del("results",k);
        for(const k of Object.keys(mem.live||{})) if(k.startsWith(id+"__")) await Store.del("live",k);
        await Store.del("tests",id); render(); } break;
    case "test-start": startTest(id); break;
    case "monitor": state.monTid=id; state.view="monitor"; render(); startMonitor(); break;
    case "monback": stopMonitor(); state.view="teacher"; state.teacherTab="tests"; render(); break;
    case "monrefresh": await refreshMon(); break;
    case "tpick":{ const V=state.tv; if(!V)break; V.ans[V.idx].picked=id; render(); pushLive(); break;}
    case "ttile":{ const V=state.tv; if(!V)break; const q=V.qs[V.idx], a=V.ans[V.idx];
      const u=q.units[+t.dataset.i]; a.tiles=a.tiles||[];
      if(a.tiles.some(x=>x.i===u.i)) break; a.tiles.push(u); render(); break;}
    case "tundo":{ const V=state.tv; if(!V)break; const a=V.ans[V.idx];
      if(a.tiles&&a.tiles.length){a.tiles.pop();render();} break;}
    case "tnext":{ const V=state.tv; if(!V)break; tvSaveCurrent(); V.idx=Math.min(V.qs.length-1,V.idx+1); render(); pushLive(true); break;}
    case "tprev":{ const V=state.tv; if(!V)break; tvSaveCurrent(); V.idx=Math.max(0,V.idx-1); render(); pushLive(true); break;}
    case "tsubmit":{ if(confirm("提出します。よろしいですか？")) await submitTest(false); break;}
    case "prog": state.progBook=id; state.pFilter=""; state.pLv=""; state.pUnit=""; state.pMore=60; state.view="progress"; render(); break;
    case "pfilter": state.pFilter=(state.pFilter===t.dataset.k)?"":t.dataset.k; state.pMore=60; render(); break;
    case "plv": state.pLv=(state.pLv===t.dataset.k)?"":t.dataset.k; state.pMore=60; render(); break;
    case "punit2": state.pUnit=(state.pUnit===t.dataset.k)?"":t.dataset.k; state.pMore=60; render(); break;
    case "pmore": state.pMore=(state.pMore||60)+60; render(); break;
    case "say":{ warmTTS(); speak(t.dataset.t,t.dataset.slow?0.6:null); break; }
    case "pmode": state.pickMode=t.dataset.m; openModal(mdPick(id)); break;
    case "mic":{
      const S=state.session; if(!S||S.fb) break;
      if(S.rec&&S.rec.st==="live"){ stopListen(); break; }
      stopSpeak();
      S.rec={st:"live",text:""}; render();
      listenOnce((txt)=>{ if(state.session&&state.session.rec){state.session.rec.text=txt; const h=$(".heard"); if(h)h.textContent=txt;} },
        (err,best,alts)=>{
          const SS=state.session; if(!SS||!SS.rec||SS.fb) return;
          if(err&&err!=="no-speech"){ SS.rec={st:"idle",text:""}; render();
            toast(ASR.blocked?"マイクが使えません。自己採点に切り替えます":"もう一度お試しください"); return; }
          const heard=SS.rec.text||best||"";
          if(!heard){ SS.rec={st:"idle",text:""}; render(); toast("聞き取れませんでした"); return; }
          SS.rec={st:"done",text:heard};
          answerQ(saidOk(SS.q.it.q,heard,alts));
        });
      break;}
    case "micrec":{
      if(MIC.st==="rec"){ micStopRec(); break; }
      stopSpeak(); micReset(); MIC.err=""; render();
      const okStart=await micStart(); if(!okStart) render();
      break;}
    case "micprobe": await micProbe(); break;
    case "self":{ const S=state.session; if(!S||S.fb) break; answerQ(t.dataset.v==="1"); break; }
    case "start": case "restart": startSession(id,20,t.dataset.lv||"",t.dataset.mode||"std",t.dataset.u||""); break;
    case "pickup": openModal(mdPick(id)); break;
    case "punit": state.pickUnit=t.dataset.u||""; openModal(mdPick(id)); break;
    case "go": { const lv=t.dataset.lv||""; warmTTS(); closeModal();
      startSession(id,20,lv==="?"?"?":lv,t.dataset.mode||"std",t.dataset.u||""); break; }
    case "introdone":{ const S=state.session; S.intro[S.q.it.id]=1; nextQ(); render(); break; }
    case "learnset-done":{ const S=state.session; if(!S||!S.q||S.q.mode!=="learnset") break;
      (S.q.ids||[]).forEach(x=>{S.intro[x]=1;}); stopSpeak(); nextQ(); render(); break; }
    case "learnset-say":{ const S=state.session; if(!S||!S.q) break;
      warmTTS(); const its=(S.q.ids||[]).map(x=>itemOf(S.bookId,x)).filter(Boolean);
      let i=0; stopSpeak();
      const go=()=>{ if(i>=its.length||!state.session||state.session.q!==S.q) return;
        speak(its[i].q); i++; setTimeout(go,1600); };
      go(); break; }
    case "choose":{ const S=state.session; if(S.fb||S.pick) break;
      const correct=id===S.q.it.id;
      S.pick=id; render();
      setTimeout(()=>answerQ(correct),correct?300:620); break;}
    case "tile":{ const S=state.session; if(S.fb) break;
      const tl=S.q.letters[+t.dataset.i]; S.tiles=S.tiles||[];
      if(S.tiles.some(p=>p.i===tl.i)) break;
      S.tiles.push(tl);
      if(S.tiles.length===(S.q.letters||[]).length){
        const made=S.tiles.map(x=>x.ch).join(S.q.join||"");
        S.typed=made; answerQ(made===(S.q.target||S.q.it.q)); }
      else render();
      break;}
    case "undo":{ const S=state.session; if(S.tiles&&S.tiles.length){S.tiles.pop();render();} break;}
    case "submitspell":{ const S=state.session; if(S.fb) break;
      const raw=(($("#spell")||{}).value||"").trim();
      if(!raw){ toast("答えを入力してください"); break; }
      S.typed=raw;
      const M=S.q.mode;
      if(M==="s-write"||M==="s-dictation"){ answerQ(normSent(raw)===normSent(S.q.it.q)); break; }
      if(M==="s-cloze"){
        const got=normSent(raw).split(" ").filter(Boolean);
        const want=S.q.answerWords.map(w=>normSent(w));
        answerQ(got.length===want.length&&got.every((g,i)=>g===want[i])); break; }
      answerQ(raw.toLowerCase().replace(/[.!?]$/,"")===S.q.it.q.toLowerCase()); break;}
    case "next": nextQ(); render(); break;

    case "csv": openModal(mdCsv()); break;
    case "csv-save":{
      const title=($("#bt")||{}).value||"", items=parseRows(($("#bc")||{}).value||"");
      if(!title.trim()){toast("教材名を入力してください");break;}
      if(items.length<2){toast("2語以上を入力してください");break;}
      await Store.put("books",uid("bk_"),{title:title.trim(),tag:"英語",items,createdAt:Date.now()});
      closeModal(); toast(items.length+"語の教材を作成しました"); break;}
    case "ai": openModal(mdAi()); break;
    case "ai-run":{
      if(state.busy) break;
      const title=(($("#at")||{}).value||"").trim(), pr=(($("#ap")||{}).value||"").trim();
      const n=Math.max(5,Math.min(60,+(($("#an")||{}).value||20)));
      if(!title||!pr){ toast("教材名とテーマを入力してください"); break; }
      const lv=($("#al")||{}).value||"3";
      state.busy=true; const st=$("#aist"); if(st) st.textContent="生成中… 20秒ほどかかります";
      try{
        const out=await SAMPLE.json(
          `日本の学習塾で使う英単語カードを作ってください。\n英検の級: ${LVL[lv]}レベル\n条件: ${pr}\n語数: ちょうど${n}語\n`+
          `出力は JSON 配列のみ。各要素は {"q":"英単語(小文字)","a":"日本語の意味(簡潔に。複数の意味は「、」区切り)","ex":"中学生レベルの短い英文。その単語を必ず含める"}。`+
          `重複する単語を入れないこと。説明文やコードフェンスは書かないこと。`,{modelTier:"default"});
        const arr=(Array.isArray(out)?out:(out&&out.items)||[]).filter(x=>x&&x.q&&x.a);
        if(!arr.length) throw new Error("結果を読み取れませんでした");
        const items=arr.map((x,i)=>({id:"i"+i+"_"+String(x.q).replace(/[^a-zA-Z0-9]/g,"").slice(0,16),
          q:String(x.q).trim(),a:String(x.a).trim(),ex:String(x.ex||"").trim(),lv:lv}));
        await Store.put("books",uid("bk_"),{title,tag:"英語",items,createdAt:Date.now(),ai:true});
        closeModal(); toast(items.length+"語の教材を作成しました");
      }catch(err){
        const m=aiErrMsg(err);
        if($("#aist")) $("#aist").innerHTML=(m==="GRANT")?aiGrantCard():`<span class="ng">${esc(m)}</span>`;
      }finally{ state.busy=false; }
      break;}
    case "viewbook": openModal(mdBook(id)); break;
    case "ai-lv":{
      if(state.busy||!SAMPLE) break;
      const b=getBook(id); if(!b) break;
      const msg=$("#lvmsg"); state.busy=true; if(msg) msg.textContent="判定中… 20秒ほどかかります";
      try{
        const out=await SAMPLE.json(
          `次の英単語について、日本の英検で最初に出題される級を判定してください。\n`+
          `単語: ${b.items.map(i=>i.q).join(", ")}\n`+
          `出力は JSON 配列のみ。各要素は {"q":"単語","lv":"5|4|3|p2|2"}。p2 は準2級。説明は書かないこと。`,
          {modelTier:"default"});
        const arr=Array.isArray(out)?out:(out&&out.items)||[];
        const map={}; arr.forEach(x=>{ if(x&&x.q) map[String(x.q).toLowerCase().trim()]=normLv(x.lv); });
        const items=b.items.map(i=>Object.assign({},i,map[i.q.toLowerCase()]?{lv:map[i.q.toLowerCase()]}:{}));
        await Store.put("books",id,Object.assign({},mem.books[id],{items}));
        openModal(mdBook(id));
      }catch(err){ const m=aiErrMsg(err);
        if($("#lvmsg")) $("#lvmsg").innerHTML=(m==="GRANT")?aiGrantCard():`<span class="ng">${esc(m)}</span>`; }
      finally{ state.busy=false; }
      break;}
    case "delbook": if(confirm("この教材を削除しますか？学習記録は残ります。")){ await Store.del("books",id); render(); } break;
    case "add-student": openModal(mdStudent()); break;
    case "student-save":{
      const n=(($("#sn")||{}).value||"").trim();
      if(!n){toast("氏名を入力してください");break;}
      const li=newLoginId(), pw=newPin();
      const sch=(($("#ss")||{}).value||"").trim(), dsel=($("#sd")||{}).value||"";
      const rec={name:n,room:($("#sr")||{}).value||ROOMS[0],
        grade:(($("#sg")||{}).value||"").trim(),school:sch,dist:dsel,
        loginId:li,pin:pw,createdAt:Date.now()};
      await Store.put("students",uid("st_"),rec);
      await learnSchool(sch,dsel||districtOf(rec));
      closeModal();
      const dd=districtOf(rec);
      toast("追加しました（ID "+li+" / パスコード "+pw+"）"+(dd?"　教科書："+DISTRICTS[dd].tb+"（"+DISTRICTS[dd].name+"）":""));
      break;}
    case "school-open": openModal(mdSchool(id)); break;
    case "school-del":{
      const m=Object.assign({},schoolBook()); delete m[id];
      await Store.put("meta","schools",m); toast("削除しました"); render(); break;}
    case "school-save":{
      const st=mem.students[id]; if(!st){closeModal();break;}
      const sch=(($("#es")||{}).value||"").trim(), dsel=($("#ed")||{}).value||"";
      const rec=Object.assign({},st,{school:sch,dist:dsel});
      await Store.put("students",id,rec);
      await learnSchool(sch,dsel||districtOf(rec));
      closeModal();
      const dd2=districtOf(rec);
      toast(dd2?(sch||"この生徒")+" → "+DISTRICTS[dd2].name+"・"+DISTRICTS[dd2].tb+" の単語が出ます":"保存しました");
      render(); break;}
    case "accounts": openModal(mdAccounts()); break;
    case "repin":{
      const st=mem.students[id]; if(!st) break;
      if(!confirm(st.name+" さんのパスコードを再発行します。よろしいですか？")) break;
      await Store.put("students",id,Object.assign({},st,{pin:newPin()}));
      openModal(mdAccounts()); toast("再発行しました"); break;}
    case "copyacc":{
      const txt=students().map(x=>`${x.name}\t${x.room||""}\t${x.loginId||""}\t${x.pin||""}`).join("\n");
      try{ await navigator.clipboard.writeText("氏名\t教室\tログインID\tパスコード\n"+txt); toast("コピーしました"); }
      catch(e){ toast("コピーできませんでした"); }
      break;}
    case "newassign": if(!books().length){toast("先に教材を作成してください");break;} openModal(mdAssign()); break;
    case "assign-save":{
      const ttl=(($("#ant")||{}).value||"").trim()||"課題";
      const ids=[...document.querySelectorAll(".anst:checked")].map(c=>c.value);
      await Store.put("assignments",uid("as_"),{title:ttl,bookId:($("#anb")||{}).value,
        studentIds:ids,due:($("#and")||{}).value,target:+(($("#ang")||{}).value||80),createdAt:Date.now()});
      closeModal(); toast("課題を配信しました"); break;}
    case "delassign": if(confirm("この課題を削除しますか？")){ await Store.del("assignments",id); render(); } break;
    case "setbatch":{ const c=Object.assign({},(mem.meta&&mem.meta.config)||{},{batch:+t.dataset.n});
      await Store.put("meta","config",c); toast("まとめて覚える語数を"+t.dataset.n+"にしました"); render(); break;}
    case "setpin":{
      const v=(($("#newpin")||{}).value||"").trim();
      if(v.length<4){toast("4桁以上にしてください");break;}
      await Store.put("meta","config",Object.assign({},(mem.meta&&mem.meta.config)||{},{pin:v}));
      toast("パスコードを変更しました"); render(); break;}
    case "wipedemo":{
      if(!confirm("サンプルの教材・生徒・課題・学習記録を削除します。よろしいですか？")) break;
      for(const b of books()) if(b.demo) await Store.del("books",b.id);
      for(const a of assignments()) if(a.demo) await Store.del("assignments",a.id);
      for(const s of students()) if(s.demo){
        for(const k of Object.keys(mem.progress||{})) if(k.startsWith(s.id+"__")) await Store.del("progress",k);
        await Store.del("students",s.id);
      }
      toast("サンプルを削除しました"); render(); break;}
  }
  }catch(err){ state.busy=false; showErr(err&&(err.stack||err.message)||err); }
});
document.addEventListener("input",e=>{
  const el=e.target; if(!el||el.id!=="practice") return;
  const S=state.session; if(!S||!S.fb) return;
  const t=String(S.fb.it.q||"").toLowerCase(), v=String(el.value||"").trim().toLowerCase();
  const msg=document.getElementById("pmsg");
  const set=(color,text,cls)=>{ el.style.borderColor=color; if(msg){ msg.textContent=text; msg.className="tiny "+(cls||""); } };
  if(!v){ set("","",""); return; }
  if(v===t){ set("var(--good)","✓ 正しく書けました","ok"); return; }
  let k=0; while(k<v.length&&k<t.length&&v[k]===t[k]) k++;
  if(k===v.length&&v.length<t.length) set("var(--accent)","ここまで合っています（あと"+(t.length-v.length)+"文字）","");
  else set("var(--crit)",(k+1)+"文字目がちがいます","ng");
});
document.addEventListener("change",async e=>{
  if(e.target&&e.target.id==="tb"){ state.tBook=e.target.value; openModal(mdTest()); return; }
  const el=e.target.closest('[data-act="setlv"]'); if(!el) return;
  const bid=el.dataset.book, iid=el.dataset.item, b=mem.books&&mem.books[bid]; if(!b) return;
  const items=b.items.map(i=>i.id===iid?Object.assign({},i,{lv:el.value}):i);
  await Store.put("books",bid,Object.assign({},b,{items}));
  toast("級を更新しました");
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&state.view==="study"&&state.session&&state.session.q){
    if(state.session.q.mode==="spell"&&!state.session.fb){ e.preventDefault();
      const b=document.querySelector('[data-act="submitspell"]'); if(b)b.click(); }
    else if(state.session.fb&&!state.session.fb.correct){ e.preventDefault(); nextQ(); render(); }
  }
  if(e.key==="Escape"&&modalHtml) closeModal();
});

/* ---------- 起動 ---------- */
let monTimer=null;
async function refreshMon(){
  try{ await Store.all("live"); await Store.all("results"); await Store.all("tests"); saveLocal();
    if(state.view==="monitor") render(); }catch(e){}
}
function startMonitor(){ clearInterval(monTimer);
  if(!Store.cloud) return;
  monTimer=setInterval(()=>{ if(state.view!=="monitor"){clearInterval(monTimer);return;} refreshMon(); },4000); }
function stopMonitor(){ clearInterval(monTimer); }

let pollTimer=null;
function startPolling(){
  clearInterval(pollTimer);
  if(!Store.cloud) return;
  pollTimer=setInterval(async()=>{
    if(state.view!=="student") return;
    try{
      const before=JSON.stringify(mem.tests)+JSON.stringify(mem.results);
      await Store.all("tests"); await Store.all("results");
      saveLocal();
      if(before!==JSON.stringify(mem.tests)+JSON.stringify(mem.results)) render();
    }catch(e){}
  },8000);
}

(async function boot(){
  loadLocal();
  initTTS();
  document.addEventListener("pointerdown",warmTTS,{once:true});
  render();
  try{
    await sbFetch("docs?select=id&limit=1");
    Store.cloud=true;
  }catch(e){ Store.cloud=false; sbBanner(true,"サーバーに接続できません。この端末の記録で動いています"); }
  if(Store.cloud){
    await Promise.all(COLLS.map(c=>Store.all(c).catch(()=>{})));
    saveLocal();
  }
  await seedIfEmpty().catch(()=>{});
  await ensureAccounts().catch(()=>{});
  await ensureLevelBooks().catch(()=>{});
  await ensureSWBooks().catch(()=>{});
  startPolling();
  render();
})();
</script>
