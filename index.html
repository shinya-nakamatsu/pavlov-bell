<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7C7B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パブロフのベル">
<style>html,body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>パブロフのベル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#E9ECF1; --surface:#FFFFFF; --surface2:#F4F6F9; --raise:#FDFDFE;
  --ink:#141920; --ink2:#5A6474; --ink3:#8A94A4;
  --line:#DCE1E9; --line2:#C7CEDA;
  --accent:#0E7C7B; --accent-ink:#0B5F5E; --accent-soft:#DCECEB;
  --brass:#A9741F; --brass-soft:#F2E7D2;
  --good:#2C9265; --warn:#C4841B; --crit:#C64A40;
  --heat:14,124,123;
  --lv5:#7FBFBB; --lv4:#4FA8A3; --lv3:#1F8C86; --lvp2:#136B67; --lv2:#0A4A48;
  --st-done:#17835C; --st-learn:#E0A800; --st-weak:#B32D26; --st-unknown:#B9C1CE;
  --st-done-ink:#FFFFFF; --st-learn-ink:#3A2C00; --st-weak-ink:#FFFFFF; --st-unknown-ink:#33404F;
  --shadow:0 1px 2px rgba(20,25,32,.05), 0 8px 24px -12px rgba(20,25,32,.18);
  --shadow-lift:0 2px 4px rgba(20,25,32,.06), 0 18px 40px -18px rgba(20,25,32,.30);
  --r:14px; --r-s:9px;
  --jp:"Zen Kaku Gothic New",-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  --en:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --surface:#161B22; --surface2:#1C232D; --raise:#202834;
    --ink:#E7ECF3; --ink2:#9EAABA; --ink3:#6E7A8A;
    --line:#28303B; --line2:#39434F;
    --accent:#3AABA6; --accent-ink:#7FD3CE; --accent-soft:#14312F;
    --brass:#D3A252; --brass-soft:#2C2317;
    --good:#43B37D; --warn:#DFA53F; --crit:#E06B60;
    --heat:58,171,166;
    --lv5:#3E7B78; --lv4:#4FA39E; --lv3:#5FC2BC; --lvp2:#8FD9D3; --lv2:#BDECE8;
  --st-done:#3FBE86; --st-learn:#F0BE3A; --st-weak:#E8695C; --st-unknown:#47525F;
  --st-done-ink:#08301F; --st-learn-ink:#3A2C00; --st-weak-ink:#3A0F0B; --st-unknown-ink:#DCE3EC;
    --st-done:#3FBE86; --st-learn:#F0BE3A; --st-weak:#E8695C; --st-unknown:#47525F;
    --st-done-ink:#08301F; --st-learn-ink:#3A2C00; --st-weak-ink:#3A0F0B; --st-unknown-ink:#DCE3EC;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B22; --surface2:#1C232D; --raise:#202834;
  --ink:#E7ECF3; --ink2:#9EAABA; --ink3:#6E7A8A;
  --line:#28303B; --line2:#39434F;
  --accent:#3AABA6; --accent-ink:#7FD3CE; --accent-soft:#14312F;
  --brass:#D3A252; --brass-soft:#2C2317;
  --good:#43B37D; --warn:#DFA53F; --crit:#E06B60;
  --heat:58,171,166;
  --lv5:#3E7B78; --lv4:#4FA39E; --lv3:#5FC2BC; --lvp2:#8FD9D3; --lv2:#BDECE8;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 18px 40px -18px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--jp);
  -webkit-font-smoothing:antialiased;line-height:1.65;margin:0}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance;line-height:1.35}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line2);border-radius:var(--r-s);padding:9px 11px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
::placeholder{color:var(--ink3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- PAVLOV Connect 準拠ログイン ---------- */
.pvlogin{--pv-red:#C30D23;--pv-red-d:#950006;--pv-line:#E0E0E0;--pv-ink:#1A1A1A;--pv-w:400px;
  min-height:100vh;background:#FFFFFF;color:var(--pv-ink);
  display:flex;flex-direction:column;align-items:center;
  padding:clamp(24px,5vh,48px) 16px 48px}
.pvlogin *{border-radius:0}
.pvbrand{text-align:center;margin-bottom:24px}
.pvbrand .lockup{width:236px;max-width:72vw;height:auto;margin:0 auto;display:block}
.pvbrand .sm{font:700 10.5px/1 var(--jp);letter-spacing:.24em;margin-top:10px}
.pvbrand .sm .r{color:var(--pv-red)}
.pvbrand .sm .k{color:#111111}
.pvbrand .jp{font-size:11.5px;color:#737373;margin-top:8px}
.pvtabs{display:flex;width:100%;max-width:var(--pv-w);border:1px solid var(--pv-red);margin-bottom:16px}
.pvtabs button{flex:1;height:46px;font-weight:700;font-size:14px;
  background:#fff;color:var(--pv-ink);transition:.14s;border:0}
.pvtabs button[aria-selected="true"]{background:var(--pv-red);color:#fff}
.pvcard{width:100%;max-width:var(--pv-w);background:#fff;border:1px solid var(--pv-line);
  padding:22px 20px 24px;display:flex;flex-direction:column;gap:16px}
.pvf{display:flex;flex-direction:column;gap:6px}
.pvf > label{font-size:12px;color:#666666;font-weight:500;letter-spacing:0}
.pvf input{height:46px;background:#fff;border:1px solid #D1D5DB;
  padding:0 12px;font-size:16px;color:#111111}
.pvf input:focus{border-color:var(--pv-red)}
.pvf input:focus-visible{outline:2px solid var(--pv-red);outline-offset:0}
.pvf input::placeholder{color:#A3AAB3}
.pvbtn{width:100%;height:50px;background:var(--pv-red);color:#fff;
  font-weight:700;font-size:15px;letter-spacing:.12em;transition:.14s;border:0;margin-top:2px}
.pvbtn:hover,.pvbtn:active{background:var(--pv-red-d)}
.pvbtn.line{background:#fff;color:var(--pv-red);border:1px solid var(--pv-red);font-size:14px;height:46px;letter-spacing:.04em}
.pvbtn.line:hover{background:#FBF1F2}
.pvlink{display:block;width:100%;text-align:center;color:var(--pv-red);
  font-size:12.5px;text-decoration:underline;background:none;border:0}
.pvchk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#4B5563}
.pvchk input{width:16px;height:16px;flex:none;accent-color:var(--pv-red)}
.pvnote{font-size:11.5px;color:#888888;text-align:center;width:100%;max-width:var(--pv-w);line-height:1.7;margin:0}
.pvsub{width:100%;max-width:var(--pv-w);margin-top:30px;padding-top:16px;
  border-top:1px dashed #E5E7EB;display:flex;flex-direction:column;gap:8px}
.pvsub .h{font-size:11px;font-weight:700;color:#9CA3AF;letter-spacing:.08em}
.pvpick{display:grid;gap:8px}
.pvpick button{text-align:left;border:1px solid #E5E7EB;background:#F9FAFB;
  padding:10px 14px;width:100%}
.pvpick button:hover{border-color:var(--pv-red)}
.pvpick b{display:block;font-size:13px;color:#374151;font-weight:700}
.pvpick span{font-size:11px;color:#6B7280;font-family:var(--mono)}
@media (max-width:400px){ .pvbrand .lockup{width:210px} }

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 56px}
.wrap.wide{max-width:1120px}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.topbar .inner{max-width:1120px;margin:0 auto;width:100%;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:.01em}
.brand svg{width:22px;height:22px;display:block}
.brand .sub{font:600 10px/1 var(--mono);letter-spacing:.16em;color:var(--ink3);
  text-transform:uppercase;padding-left:9px;margin-left:2px;border-left:1px solid var(--line2)}
.spacer{flex:1}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap14{gap:14px}.gap20{gap:20px}.gap28{gap:28px}
.row{display:flex;align-items:center;gap:10px}
.wraprow{display:flex;flex-wrap:wrap;gap:8px}
.eyebrow{font:600 10.5px/1.4 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--ink3)}
.muted{color:var(--ink2);font-size:13.5px}
.tiny{color:var(--ink3);font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:var(--r-s);font-weight:700;font-size:14.5px;
  background:var(--surface2);border:1px solid var(--line2);transition:.14s}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{color:var(--crit);border-color:var(--line2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn.big{padding:14px 20px;font-size:16px;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font:600 11.5px/1.6 var(--jp);background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.pill.acc{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.divider{height:1px;background:var(--line)}
.field{display:flex;flex-direction:column;gap:5px}
.field > label{font-size:12.5px;font-weight:700;color:var(--ink2)}

/* ---------- memory ring ---------- */
.ring{position:relative;display:grid;place-items:center;flex:none;
  border-radius:50%;background:conic-gradient(var(--rc) calc(var(--p)*1%), var(--line) 0)}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.ring > *{position:relative}
.ring .v{font:700 20px/1 var(--mono);font-variant-numeric:tabular-nums}
.ring .v small{font-size:10px;font-weight:600;color:var(--ink3);margin-left:1px}
.ring.lg{width:104px;height:104px}
.ring.lg::before{inset:9px}
.ring.lg .v{font-size:27px}
.ring.sm{width:52px;height:52px}
.ring.sm::before{inset:5px}
.ring.sm .v{font-size:13.5px}
.ring.sm .v small{font-size:8px}

/* ---------- bars ---------- */
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.seg{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--line)}
.seg > i{display:block;height:100%}

/* ---------- login ---------- */
.hero{padding:34px 0 8px;text-align:center}
.hero .bell{width:62px;height:62px;margin:0 auto 14px;display:block;color:var(--brass)}
.hero h1{font-size:31px;letter-spacing:.03em}
.hero .tag{color:var(--ink2);font-size:14px;margin-top:8px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);
  padding:12px 13px;text-align:left;transition:.14s;display:flex;flex-direction:column;gap:2px}
.pick:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.pick b{font-size:15px}
.pick span{font-size:11.5px;color:var(--ink3)}

/* ---------- study ---------- */
.study{max-width:560px;margin:0 auto;padding:0 16px 40px;min-height:100vh;display:flex;flex-direction:column}
.study-head{padding:14px 0 12px;display:flex;flex-direction:column;gap:9px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 20px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;
  gap:12px;justify-content:center;min-height:170px}
.qtype{font:600 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.qword{font-family:var(--en);font-size:42px;line-height:1.15;font-weight:600;letter-spacing:-.01em;word-break:break-word}
.qjp{font-size:26px;font-weight:700}
.qex{font-family:var(--en);font-size:16px;color:var(--ink2);line-height:1.5}
.qex .blank{display:inline-block;min-width:76px;border-bottom:2px solid var(--accent);vertical-align:-3px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--r-s);
  padding:14px 16px;text-align:left;font-size:16px;font-weight:500;transition:.12s}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice.en{font-family:var(--en);font-size:20px}
.choice.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.choice.ng{border-color:var(--crit);background:color-mix(in srgb,var(--crit) 13%,transparent)}
.choice.dim{opacity:.45}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
.tile{font-family:var(--en);font-size:21px;font-weight:600;min-width:42px;height:48px;
  border:1.5px solid var(--line2);border-radius:8px;background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;transition:.12s}
.tile:hover{border-color:var(--accent)}
.tile.used{opacity:.25;pointer-events:none}
.slot{min-height:56px;border-bottom:2px dashed var(--line2);display:flex;gap:4px;
  justify-content:center;align-items:center;font-family:var(--en);font-size:26px;font-weight:600;
  letter-spacing:.02em;padding:4px 0}
.spellin{font-family:var(--en);font-size:24px;text-align:center;padding:14px}
.mongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.moncard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  display:flex;flex-direction:column;gap:9px;border-left-width:4px;border-left-style:solid}
.moncard.taking{border-left-color:var(--accent)}
.moncard.done{border-left-color:var(--good)}
.moncard.idle{border-left-color:var(--line2)}
.moncard .nm{font-weight:700;font-size:15.5px}
.moncard .mm{font:600 12.5px/1.6 var(--mono);color:var(--ink2);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.livebadge{display:inline-flex;align-items:center;gap:6px;font:700 11.5px/1.7 var(--jp);color:var(--crit)}
.livebadge .dot{background:var(--crit);animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.qbar{display:flex;gap:3px;flex-wrap:wrap}
.qbar i{width:14px;height:14px;border-radius:4px;background:var(--line)}
.qbar i.ok{background:var(--good)}
.qbar i.ng{background:var(--crit)}
.timer{font:700 15px/1 var(--mono);font-variant-numeric:tabular-nums;padding:5px 10px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--line2)}
.timer.warn{background:color-mix(in srgb,var(--crit) 18%,transparent);border-color:var(--crit);color:var(--crit)}
.tstate{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font:700 11.5px/1.7 var(--jp)}
.tstate.live{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.tstate.wait{background:var(--surface2);color:var(--ink2)}
.tstate.done{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.tstate i{width:7px;height:7px;border-radius:50%;background:currentColor}
.sent{font-family:var(--en);font-size:23px;line-height:1.6;font-weight:500}
.sent .blank{display:inline-block;min-width:76px;border-bottom:2px solid var(--accent);vertical-align:-3px;margin:0 3px}
.wtile{font-family:var(--en);font-size:18px;font-weight:600;padding:9px 13px;
  border:1.5px solid var(--line2);border-radius:9px;background:var(--surface);transition:.12s}
.wtile:hover{border-color:var(--accent)}
.wtile.used{opacity:.25;pointer-events:none}
.wslot{min-height:62px;border-bottom:2px dashed var(--line2);display:flex;gap:7px;flex-wrap:wrap;
  justify-content:center;align-items:center;font-family:var(--en);font-size:20px;font-weight:600;padding:8px 0}
.chrow.words{font-size:17px;gap:5px}
.chrow.words .ch{min-width:0;padding:2px 6px}
.chrow{display:flex;flex-wrap:wrap;gap:3px;font-family:var(--en);font-size:23px;font-weight:600;line-height:1.2}
.ch{min-width:17px;text-align:center;padding:2px 3px;border-radius:5px}
.ch.eq{color:var(--ink)}
.ch.sub{background:color-mix(in srgb,var(--crit) 22%,transparent);color:var(--crit)}
.ch.extra{background:color-mix(in srgb,var(--crit) 22%,transparent);color:var(--crit);text-decoration:line-through}
.ch.miss{background:color-mix(in srgb,var(--good) 24%,transparent);color:var(--good)}
.ch.gap{color:var(--ink3);opacity:.45}
.difflab{font:600 10.5px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.diffbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;
  display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.feedback{margin-top:14px;border-radius:var(--r);padding:13px 15px;display:flex;gap:11px;align-items:flex-start}
.feedback.ok{background:color-mix(in srgb,var(--good) 12%,transparent);border:1px solid color-mix(in srgb,var(--good) 35%,transparent)}
.feedback.ng{background:color-mix(in srgb,var(--crit) 12%,transparent);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent)}
.feedback .ttl{font-weight:700;font-size:14px}
.feedback .ans{font-family:var(--en);font-size:19px;font-weight:600}

/* ---------- teacher ---------- */
.tabs{display:flex;gap:2px;background:var(--surface2);padding:3px;border-radius:10px;
  border:1px solid var(--line);width:fit-content;max-width:100%;overflow-x:auto}
.tab{padding:7px 15px;border-radius:7px;font-weight:700;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink3);
  text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface2)}
.heat{display:inline-flex;align-items:center;justify-content:center;min-width:46px;
  padding:3px 8px;border-radius:6px;font-family:var(--mono);font-size:12.5px;font-weight:600;
  font-variant-numeric:tabular-nums}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  display:flex;flex-direction:column;gap:3px}
.stat .k{font:600 10.5px/1.4 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.stat .v{font:700 27px/1.1 var(--mono);font-variant-numeric:tabular-nums}

<script>
"use strict";
/* =========================================================
   パブロフのベル — 記憶定着アプリ (PAVLOV)
   ========================================================= */
const $=(s,r)=>(r||document).querySelector(s);
function showErr(msg){

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>(p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DAY=86400000;
const app=$("#app");

const ROOMS=["仲井真","糸満","新都心","沖尚前","富士学院","チャンプ","豊崎","真嘉比","小3学園"];

/* ---------- 教科書採択地区（沖縄県・令和7年度） ---------- */
const DISTRICTS={
  kunigami:{name:"国頭地区",pub:"光村図書",tb:"Here We Go!"},
  nakagami:{name:"中頭地区",pub:"光村図書",tb:"Here We Go!"},
  naha:{name:"那覇地区",pub:"三省堂",tb:"NEW CROWN"},
  shimajiri:{name:"島尻地区",pub:"開隆堂",tb:"SUNSHINE"},
  miyako:{name:"宮古地区",pub:"開隆堂",tb:"SUNSHINE"},
  yaeyama:{name:"八重山地区",pub:"開隆堂",tb:"SUNSHINE"},
  taketomi:{name:"竹富地区",pub:"東京書籍",tb:"NEW HORIZON"}
};
const DKEYS=["naha","shimajiri","nakagami","kunigami","miyako","yaeyama","taketomi"];
const CITY2D={
  "名護":"kunigami","本部":"kunigami","金武":"kunigami","国頭":"kunigami","大宜味":"kunigami",
  "東村":"kunigami","今帰仁":"kunigami","宜野座":"kunigami","伊江":"kunigami","伊平屋":"kunigami","伊是名":"kunigami",
  "うるま":"nakagami","宜野湾":"nakagami","沖縄市":"nakagami","嘉手納":"nakagami","北谷":"nakagami",
  "西原":"nakagami","読谷":"nakagami","北中城":"nakagami","中城":"nakagami","恩納":"nakagami",
  "那覇":"naha","浦添":"naha","久米島":"naha","南大東":"naha","北大東":"naha",
  "糸満":"shimajiri","豊見城":"shimajiri","南城":"shimajiri","八重瀬":"shimajiri","与那原":"shimajiri",
  "南風原":"shimajiri","渡嘉敷":"shimajiri","座間味":"shimajiri","粟国":"shimajiri","渡名喜":"shimajiri",
  "宮古島":"miyako","多良間":"miyako","石垣":"yaeyama","与那国":"yaeyama","竹富":"taketomi"
};
/* PAVLOVの教室から推測する既定の地区 */
const ROOM2D={"仲井真":"naha","新都心":"naha","沖尚前":"naha","真嘉比":"naha","小3学園":"naha",
  "糸満":"shimajiri","豊崎":"shimajiri","チャンプ":"naha","富士学院":"naha"};
const normSchool=x=>String(x||"").trim().replace(/\s+/g,"")
  .replace(/^沖縄県/,"").replace(/^(那覇|浦添|糸満|豊見城|南城|宜野湾|沖縄|うるま|名護|石垣|宮古島)市立/,"")
  .replace(/[町村]立/,"").replace(/学校$/,"");
function schoolBook(){ return (mem.meta&&mem.meta.schools)||{}; }
function districtOf(s){
  if(!s) return "";
  if(s.dist&&DISTRICTS[s.dist]) return s.dist;
  const key=normSchool(s.school);
  const map=schoolBook();
  if(key&&map[key]) return map[key];
  const raw=String(s.school||"");
  for(const c in CITY2D) if(raw.indexOf(c)>=0) return CITY2D[c];
  return ROOM2D[s.room]||"";
}
function tbOf(s){ const d=districtOf(s); return d?DISTRICTS[d].tb:""; }
/* その生徒に見せる教材：教科書教材はその地区のものだけ、英検など汎用教材は全員に見せる */
function booksFor(s){
  const tb=tbOf(s), all=books();
  if(!tb) return all;
  return all.filter(b=>!b.textbook || b.textbook===tb);
}

/* ---------- 記憶レベルの4段階判定 ---------- */
const STATES=[
  {k:"done",l:"記憶済み",c:"var(--st-done)",ink:"var(--st-done-ink)",d:"安定して思い出せる"},
  {k:"learn",l:"記憶中",c:"var(--st-learn)",ink:"var(--st-learn-ink)",d:"覚えかけ。復習すると伸びる"},
  {k:"weak",l:"弱点",c:"var(--st-weak)",ink:"var(--st-weak-ink)",d:"間違いが多い。重点的に"},
  {k:"unknown",l:"不明",c:"var(--st-unknown)",ink:"var(--st-unknown-ink)",d:"まだ出題されていない"}];
const ST={}; STATES.forEach(x=>ST[x.k]=x);
function classify(rec,now){
  if(!rec||!rec.seen) return "unknown";
  const m=memoryOf(rec,now), ok=rec.ok||0, ng=rec.ng||0, tot=ok+ng;
  if(m>=0.85&&ok>=2) return "done";
  if(ng>=2&&tot&&ng/tot>=0.34) return "weak";
  if(m<0.2&&ng>=1) return "weak";
  return "learn";
}
function stateCounts(sid,bookIds){
  const now=Date.now(), c={done:0,learn:0,weak:0,unknown:0}; let msum=0,mn=0;
  (bookIds||books().map(b=>b.id)).forEach(bid=>{
    const b=getBook(bid); if(!b) return;
    const p=getProg(sid,bid);
    b.items.forEach(it=>{ const rec=p.items[it.id];
      c[classify(rec,now)]++; msum+=memoryOf(rec,now); mn++; });
  });
  c.total=mn; c.avg=mn?msum/mn:0;
  return c;
}
const pol=(cx,cy,r,a)=>[cx+r*Math.cos(a-Math.PI/2),cy+r*Math.sin(a-Math.PI/2)];
function arcPath(cx,cy,r1,r2,a0,a1){
  const big=(a1-a0)>Math.PI?1:0;
  const A=pol(cx,cy,r2,a0),B=pol(cx,cy,r2,a1),C=pol(cx,cy,r1,a1),D=pol(cx,cy,r1,a0);
  return `M${A[0].toFixed(2)} ${A[1].toFixed(2)} A${r2} ${r2} 0 ${big} 1 ${B[0].toFixed(2)} ${B[1].toFixed(2)}`+
         ` L${C[0].toFixed(2)} ${C[1].toFixed(2)} A${r1} ${r1} 0 ${big} 0 ${D[0].toFixed(2)} ${D[1].toFixed(2)} Z`;
}
// 4段階の内訳ドーナツ。中央は全体の記憶度。
function donut(c,size){
  const S=size||230, cx=S/2, cy=S/2, r2=S/2-2, r1=S*0.29;
  const tot=STATES.reduce((a,x)=>a+(c[x.k]||0),0);
  if(!tot) return `<div class="empty">まだ学習記録がありません</div>`;
  let a=0, out="";
  const only=STATES.filter(x=>c[x.k]>0).length===1;
  STATES.forEach(x=>{
    const v=c[x.k]||0; if(!v) return;
    const span=v/tot*Math.PI*2;
    const gap=only?0:Math.min(2/r2,span*0.18);
    const a0=a+gap/2, a1=a+span-gap/2;
    const pct=v/tot*100;
    out+=`<path d="${arcPath(cx,cy,r1,r2,a0,Math.min(a1,a0+Math.PI*1.9999))}" fill="${x.c}"><title>${x.l} ${v}語（${pct.toFixed(1)}%）</title></path>`;
    if(pct>=7){
      const mid=(a0+a1)/2, pt=pol(cx,cy,(r1+r2)/2,mid);
      out+=`<text x="${pt[0].toFixed(1)}" y="${pt[1].toFixed(1)}" text-anchor="middle" dominant-baseline="central"
        style="font:700 ${S*0.062}px var(--mono);fill:${x.ink};pointer-events:none">${pct.toFixed(1)}%</text>`;
    }
    a+=span;
  });
  return `<div class="donut"><svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img"
    aria-label="記憶レベルの内訳">${out}
    <text x="${cx}" y="${cy-6}" text-anchor="middle" style="font:700 ${S*0.115}px var(--mono);fill:var(--ink)">${Math.round((c.avg||0)*100)}%</text>
    <text x="${cx}" y="${cy+S*0.075}" text-anchor="middle" style="font:600 ${S*0.048}px var(--jp);fill:var(--ink3)">記憶度</text>
  </svg></div>`;
}
function stateLegend(c,clickable){
  const tot=STATES.reduce((a,x)=>a+(c[x.k]||0),0)||1;
  return `<div class="stlegend">${STATES.map(x=>{
    const v=c[x.k]||0;
    const inner=`<i style="background:${x.c}"></i><span class="lb">${x.l}</span>
      <span class="vv">${v}語 ・${(v/tot*100).toFixed(1)}%</span>`;
    return clickable?`<button data-act="pfilter" data-k="${x.k}" aria-pressed="${state.pFilter===x.k}">${inner}</button>`
      :`<button type="button" style="cursor:default">${inner}</button>`;}).join("")}</div>`;
}

/* ---------- 音声：聞く（読み上げ）と 話す（音声認識） ---------- */
const IC_SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const IC_MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/></svg>';
const VKEY="pavlov-voice-v1";
const TTS={ok:false,on:true,rate:0.9,voice:null,warm:false};
try{const v=JSON.parse(localStorage.getItem(VKEY)||"{}"); if(typeof v.on==="boolean")TTS.on=v.on; if(v.rate)TTS.rate=v.rate;}catch(e){}
function saveVoice(){ try{localStorage.setItem(VKEY,JSON.stringify({on:TTS.on,rate:TTS.rate}));}catch(e){} }
function initTTS(){
  if(!("speechSynthesis" in window)) return;
  TTS.ok=true;
  const pick=()=>{
    let vs=[]; try{vs=speechSynthesis.getVoices()||[];}catch(e){}
    const en=vs.filter(v=>/^en/i.test(v.lang||""));
    TTS.voice=en.find(v=>/en[-_]US/i.test(v.lang)&&/Samantha|Ava|Google US English|Alex|Zira/i.test(v.name))
      ||en.find(v=>/en[-_]US/i.test(v.lang))||en[0]||null;
  };
  pick();
  try{ speechSynthesis.addEventListener("voiceschanged",pick); }catch(e){}
}
function speak(text,rate){
  if(!TTS.ok||!TTS.on||!text) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    if(TTS.voice) u.voice=TTS.voice;
    u.lang=(TTS.voice&&TTS.voice.lang)||"en-US";
    u.rate=rate||TTS.rate; u.pitch=1; u.volume=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
function stopSpeak(){ try{speechSynthesis.cancel();}catch(e){} }
function warmTTS(){ if(TTS.warm||!TTS.ok) return; TTS.warm=true;
  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){} }
const spkBtn=(text,cls)=>TTS.ok?`<button class="say ${cls||""}" data-act="say" data-t="${esc(text)}" aria-label="発音を聞く" title="発音を聞く">${IC_SPK}</button>`:"";

const MIC={
  sup:!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia),
  st:"idle", err:"", stream:null, mr:null, chunks:[], url:"", secs:0, timer:null, gen:0
};
function micLabel(){ return MIC.st==="rec"?"録音中… タップで停止":"タップして録音する"; }
async function micStart(onStop){
  if(!MIC.sup){ MIC.err="このブラウザはマイクに対応していません"; return false; }
  try{
    const gen=++MIC.gen;
    const stream=await Promise.race([
      navigator.mediaDevices.getUserMedia({audio:true}),
      new Promise((_,rj)=>setTimeout(()=>rj(new Error("TimeoutError")),12000))]);
    if(gen!==MIC.gen){ stream.getTracks().forEach(t=>t.stop()); return false; }
    MIC.stream=stream; MIC.chunks=[];
    let mr=null;
    for(const t of ["audio/webm","audio/mp4",""]){
      try{ mr=t?new MediaRecorder(stream,{mimeType:t}):new MediaRecorder(stream); break; }catch(e){}
    }
    if(!mr){ MIC.err="録音を開始できませんでした"; return false; }
    MIC.mr=mr;
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) MIC.chunks.push(e.data); };
    mr.onstop=()=>{
      if(gen!==MIC.gen){ try{ if(MIC.stream){MIC.stream.getTracks().forEach(t=>t.stop());MIC.stream=null;} }catch(e){} return; }
      try{ if(MIC.url) URL.revokeObjectURL(MIC.url); }catch(e){}
      const blob=new Blob(MIC.chunks,{type:MIC.chunks[0]?MIC.chunks[0].type:"audio/webm"});
      MIC.url=URL.createObjectURL(blob); MIC.st="done";
      if(MIC.stream){ MIC.stream.getTracks().forEach(t=>t.stop()); MIC.stream=null; }
      clearInterval(MIC.timer); MIC.timer=null;
      onStop&&onStop(); render();
    };
    mr.start(); MIC.st="rec"; MIC.err=""; MIC.secs=0;
    clearInterval(MIC.timer);
    MIC.timer=setInterval(()=>{ MIC.secs++; if(MIC.secs>=90) micStopRec(); },1000);
    return true;

// 記憶度 = 2^(-経過日数 / 半減期)。正解で半減期が伸び、不正解で縮む。
function memoryOf(rec,now){
  if(!rec||!rec.last||!rec.seen) return 0;
  const hl=Math.max(rec.hl||0.05,0.005);
  return Math.pow(2,-((now-rec.last)/DAY)/hl);
}
function applyAnswer(rec,correct,now){
  const r=rec?Object.assign({},rec):{hl:0,last:0,ok:0,ng:0,seen:0};
  const m=memoryOf(r,now);
  r.seen++;
  if(correct){
    r.ok++;
    const base=r.hl>0?r.hl:0.6;                 // 初回正解 ≒ 14時間
    const growth=r.hl>0?(1.55+1.45*(1-m)):1;    // 忘れかけで正解 → 大きく伸びる
    r.hl=Math.min(base*growth,400);
  }else{
    r.ng++;
    r.hl=Math.max((r.hl||0.05)*0.28,0.01);      // ≒15分後に再出題
  }
  r.last=now;
  return r;
}

function rnd(seed){ let s=seed; return()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }

async function seedIfEmpty(){
  const books=await Store.all("books");
  if(Object.keys(books).length) return;
  const bA="bk_eiken3", bB="bk_chu2";
  await Store.put("books",bA,mkBook("英検3級 コア英単語 38",SEED_A,"英語"));
  await Store.put("books",bB,mkBook("中2 英単語 Stage 1",SEED_B,"英語"));

  for(let i=0;i<SEED_STUDENTS.length;i++){
    const s=SEED_STUDENTS[i], sid="st_demo"+i;
    await Store.put("students",sid,{name:s[0],room:s[1],grade:s[2],demo:true,createdAt:now});
    // それらしい学習履歴を作る
    const R=rnd(i*977+13), skill=0.35+R()*0.6;
    for(const [bid,seed] of [[bA,SEED_A],[bB,SEED_B]]){
      if(i%3===2 && bid===bB) continue;
      const items={}; const cnt=Math.round(seed.length*(0.35+R()*0.6));
      for(let k=0;k<cnt;k++){
        const ok=R()<skill;
        items["i"+k+"_"+seed[k][0].replace(/[^a-z]/gi,"")]={
          hl:ok?(0.5+R()*9):(0.05+R()*0.7), last:now-R()*4.5*DAY,
          ok:Math.round(1+R()*4), ng:ok?Math.round(R()*1):Math.round(1+R()*2), seen:Math.round(2+R()*5)};
      }
      await Store.put("progress",sid+"__"+bid,{sid,bid,items,updatedAt:now-R()*3*DAY});
    }
  }

    demo:true,createdAt:now});
}

function newLoginId(){
  const used={}; Object.values(mem.students||{}).forEach(x=>{ if(x.loginId) used[String(x.loginId).toLowerCase()]=1; });
  for(let i=0;i<400;i++){ const id="pv"+String(Math.floor(1000+Math.random()*9000));
    if(!used[id]) return id; }
  return "pv"+Date.now().toString(36).slice(-4);
}
const newPin=()=>String(Math.floor(1000+Math.random()*9000));
function findAccount(loginId,pin){
  const id=String(loginId||"").trim().toLowerCase().replace(/\s/g,"");
  const pw=String(pin||"").trim();
  const hit=Object.entries(mem.students||{}).find(([k,v])=>
    String(v.loginId||"").toLowerCase()===id && String(v.pin||"")===pw);
  return hit?Object.assign({id:hit[0]},hit[1]):null;
}
async function ensureAccounts(){
  const list=Object.entries(mem.students||{}).filter(([k,v])=>!v.loginId||!v.pin);
  for(const [k,v] of list){
    await Store.put("students",k,Object.assign({},v,{loginId:v.loginId||newLoginId(),pin:v.pin||newPin()}));
  }
}

function mkLvBook(k){
  const rows=SEED_LV[k]||[];
  return {title:LVBOOK[k]+" "+rows.length, tag:"英語", level:k, createdAt:Date.now(),
    items:rows.map((r,i)=>({id:"x"+k+"_"+i+"_"+r[0].replace(/[^a-zA-Z0-9]/g,"").slice(0,14),

}
async function ensureLevelBooks(){
  for(const k of LVKEYS){

  }
}

const state={view:"login",loginTab:"student",student:null,teacherTab:"students",session:null,detail:null,busy:false};
const books=()=>Object.entries(mem.books||{}).map(([id,b])=>Object.assign({id},b)).sort((a,b)=>a.createdAt-b.createdAt);
const students=()=>Object.entries(mem.students||{}).map(([id,s])=>Object.assign({id},s)).sort((a,b)=>(a.room+a.name).localeCompare(b.room+b.name,"ja"));
const assignments=()=>Object.entries(mem.assignments||{}).map(([id,a])=>Object.assign({id},a)).sort((a,b)=>b.createdAt-a.createdAt);
const getBook=id=>mem.books&&mem.books[id]?Object.assign({id},mem.books[id]):null;
function getProg(sid,bid){ const k=sid+"__"+bid; return (mem.progress&&mem.progress[k])||{sid,bid,items:{},updatedAt:0}; }
function bookMemory(sid,bid){
  const b=getBook(bid); if(!b||!b.items.length) return {m:0,learned:0,total:0};
  const p=getProg(sid,bid), now=Date.now(); let sum=0,learned=0;
  b.items.forEach(it=>{ const m=memoryOf(p.items[it.id],now); sum+=m; if(m>=0.9)learned++; });
  return {m:sum/b.items.length,learned,total:b.items.length};
}

function ring(m,cls,col){
  const p=Math.round(m*100), c=col||(m>=0.85?"var(--good)":m>=0.5?"var(--warn)":m>0?"var(--crit)":"var(--line2)");
  return `<div class="ring ${cls||""}" style="--p:${p};--rc:${c}"><span class="v">${p}<small>%</small></span></div>`;
}
function toast(msg){
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow-lift)";
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

function renderInner(){
  let html="";
  if(state.view==="study") html=viewStudy();
  else if(state.view==="login") html=viewLogin();
  else html=`<div class="topbar"><div class="inner">
      <div class="brand"><span style="color:var(--brass)">${BELL}</span>パブロフのベル<span class="sub">PAVLOV</span></div>
      <div class="spacer"></div>
      ${state.view!=="login"?`<span class="tiny">${esc(state.view==="teacher"?"講師モード":(state.student?state.student.room+" / "+state.student.name:""))}</span>
      <button class="btn ghost sm" data-act="logout">終了</button>`:
      `<span class="tiny">${Store.cloud?"データ同期あり":"この端末に保存"}</span>`}
    </div></div>` + (state.view==="monitor"?viewMonitor():state.view==="login"?viewLogin():state.view==="teacher"?viewTeacher():state.view==="progress"?viewProgress():state.view==="interview"?viewInterview():state.view==="test"?viewTest():viewStudent());
  if(modalHtml) html+=`<div class="scrim" data-act="scrim"><div class="modal">${modalHtml}</div></div>`;
  app.innerHTML=html;
  if(state.view==="study"&&state.session&&state.session.q) autoSpeak();
}
function autoSpeak(){
  const S=state.session,q=S.q; if(!q||S.fb||!TTS.ok||!TTS.on) return;
  if(q.mode==="learnset") return;
  const key=q.it.id+"|"+q.mode+"|"+S.asked;
  if(S.spokenKey===key) return; S.spokenKey=key;
  if(q.mode==="learnset") return;
  if(["listen","dictation","intro","s-listen","s-dictation"].indexOf(q.mode)>=0) speak(q.it.q);

    ?Object.assign({id:rememberedId()},mem.students[rememberedId()]):null;
  const demos=students().filter(x=>x.demo&&x.loginId&&x.pin);

  const tab=state.loginTab||"student";
  const isS=tab==="student";
  const body=isS?`
    ${me?`<button class="pvbtn" data-act="login-me" data-id="${me.id}">${esc(me.name)} さんとして続ける</button>

    <div style="height:1px;background:var(--pv-line)"></div>`:""}

/* =========================================================
   学習セッション
   ========================================================= */
function startSession(bookId,size,lv,mode,unit){
  const b=getBook(bookId); if(!b) return;
  const p=getProg(state.student.id,bookId), now=Date.now();
  let pick=b.items;
  if(unit) pick=pick.filter(it=>unitOf(it)===unit);
  if(lv) pick=pick.filter(it=>(lvOf(it)||"?")===lv);
  if(!pick.length) pick=b.items;
  const scored=pick.map(it=>({it,rec:p.items[it.id],m:memoryOf(p.items[it.id],now)}));
  const review=scored.filter(x=>x.rec&&x.rec.seen>0&&x.m<0.92).sort((a,b)=>a.m-b.m);
  const fresh=scored.filter(x=>!x.rec||!x.rec.seen);
  const maxNew=Math.max(3,Math.round(size*0.45));
  const rev=review.slice(0,Math.max(0,size-Math.min(fresh.length,maxNew)));
  const nw=fresh.slice(0,Math.max(0,size-rev.length));
  const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const chunk=(a,k)=>{const o=[];for(let i=0;i<a.length;i+=k)o.push(a.slice(i,i+k));return o;};
  let revIds=rev.map(x=>x.it.id), newIds=nw.map(x=>x.it.id);
  let allIds=revIds.concat(newIds);
  if(!allIds.length){ allIds=scored.sort((a,b)=>a.m-b.m).slice(0,size).map(x=>x.it.id); revIds=allIds.slice(); newIds=[]; }
  const BS=batchSize();
  const fc=chunk(shuf(newIds.slice()),BS), rc=chunk(shuf(revIds.slice()),BS);
  const plan=[];
  while(fc.length||rc.length){
    if(fc.length){ const c=fc.shift(); plan.push({type:"learn",ids:c}); plan.push({type:"ask",ids:c.slice()}); }
    if(rc.length) plan.push({type:"ask",ids:rc.shift()});
  }
  if(!plan.length) plan.push({type:"ask",ids:allIds});
  state.session={bookId,lv:lv||"",unit:unit||"",mode:mode||"std",rec:null,
    plan,queue:[],curBatch:[],total:allIds.length,asked:0,correct:0,wrong:0,
    intro:{},before:bookMemory(state.student.id,bookId).m,q:null,fb:null,tiles:null,pending:0,startedAt:now};
  state.view="study"; nextQ(); render();
}
function itemOf(bid,iid){ const b=getBook(bid); return b?b.items.find(i=>i.id===iid):null; }

function nextQ(){
  const S=state.session; S.fb=null; S.tiles=null; S.pick=null; S.typed=""; micReset();
  if(!S.queue.length){
    while(S.plan&&S.plan.length){
      const step=S.plan.shift();
      if(step.type==="learn"){ S.curBatch=step.ids.slice(); S.q={mode:"learnset",ids:step.ids.slice()}; return; }
      S.queue=step.ids.slice(); S.curBatch=step.ids.slice(); break;
    }
  }
  if(!S.queue.length||S.asked>=S.total*4){ return finishSession(); }
  const iid=S.queue[0], b=getBook(S.bookId), it=itemOf(S.bookId,iid);
  const p=getProg(state.student.id,S.bookId), rec=p.items[iid], m=memoryOf(rec,Date.now());
  if((!rec||!rec.seen)&&!S.intro[iid]){ S.q={mode:"intro",it}; return; }
  const isSent=(b.kind==="sentence");
  let mode;
  if(isSent){
    if(S.mode==="listen"&&TTS.ok) mode=(m<0.5)?"s-listen":"s-dictation";
    else if(S.mode==="speak") mode="s-recite";
    else mode=(m<0.32)?"s-order":(m<0.62)?"s-cloze":"s-write";
    const q2={mode,it,m};
    if(mode==="s-order"){
      const u=words(it.q);
      q2.letters=u.map((ch,i)=>({ch,i})).sort(()=>Math.random()-0.5);
      q2.join=" "; q2.target=u.join(" "); S.tiles=[];
    }
    if(mode==="s-cloze"){
      const u=words(it.q), n=Math.min(u.length-1,m<0.45?1:(m<0.55?2:3));
      const idx=[]; const pool=u.map((_,i)=>i).filter(i=>u[i].length>1);
      while(idx.length<n&&pool.length){ idx.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]); }
      idx.sort((x,y)=>x-y);
      q2.blanks=idx; q2.answerWords=idx.map(i=>u[i]); q2.wordsArr=u;
    }
    if(mode==="s-listen"){
      const pool=b.items.filter(x=>x.id!==it.id);
      const dis=[]; while(dis.length<3&&pool.length){
        const c=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; dis.push(c); }
      q2.opts=dis.concat([it]).sort(()=>Math.random()-0.5);
    }
    if(mode==="s-recite") S.rec={st:"idle",text:""};
    S.q=q2; return;
  }
  if(S.mode==="listen"){ mode=(m<0.55||!TTS.ok)?"listen":"dictation"; if(!TTS.ok) mode="mc-en2jp"; }
  else if(S.mode==="speak"){ mode="speak"; }
  else{
    if(m<0.18) mode="mc-en2jp";
    else if(m<0.42) mode="mc-jp2en";
    else if(m<0.68) mode=(it.ex&&Math.random()<0.5)?"cloze":"order";
    else mode="spell";
    if(TTS.ok&&m>=0.18&&Math.random()<0.25) mode=(m<0.6)?"listen":"dictation";
  }
  const q={mode,it,m};
  if(mode==="mc-en2jp"||mode==="mc-jp2en"||mode==="cloze"||mode==="listen"){
    const inB=b.items.filter(x=>x.id!==it.id&&(S.curBatch||[]).indexOf(x.id)>=0&&x.a!==it.a);
    const same=b.items.filter(x=>x.id!==it.id&&lvOf(x)===lvOf(it));
    const pool=inB.length>=3?inB:(same.length>=3?same:b.items.filter(x=>x.id!==it.id));
    const dis=[]; const used={};
    while(dis.length<3&&pool.length){
      const c=pool[Math.floor(Math.random()*pool.length)];
      const key=(mode==="mc-en2jp"||mode==="listen")?c.a:c.q;
      if(!used[key]){used[key]=1;dis.push(c);}
      else if(Object.keys(used).length>=pool.length) break;
    }
    q.opts=dis.concat([it]).sort(()=>Math.random()-0.5);
  }
  if(mode==="speak"){ S.rec={st:"idle",text:""}; }
  if(mode==="order"){ q.letters=it.q.split("").map((ch,i)=>({ch,i})).sort(()=>Math.random()-0.5);
    q.join=""; q.target=it.q; S.tiles=[]; }
  S.q=q;
}

const normSent=t=>String(t||"").toLowerCase().replace(/[.,!?;:"'’“”]/g," ").replace(/\s+/g," ").trim();
const words=t=>String(t||"").trim().split(/\s+/).filter(Boolean);
// 配列どうしの差分（編集距離のバックトレース）
function diffSeq(a,b,eqf){
  const m=a.length,n=b.length,eq=eqf||((x,y)=>x===y);
  const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) d[i][0]=i;
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(eq(a[i-1],b[j-1])?0:1));
  const A=[],B=[]; let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(eq(a[i-1],b[j-1])?0:1)){
      const e=eq(a[i-1],b[j-1]);
      A.unshift({c:a[i-1],t:e?"eq":"sub"}); B.unshift({c:b[j-1],t:e?"eq":"sub"}); i--; j--;
    }else if(i>0&&d[i][j]===d[i-1][j]+1){
      A.unshift({c:a[i-1],t:"extra"}); B.unshift({c:"",t:"gap"}); i--;
    }else{
      A.unshift({c:"",t:"gap"}); B.unshift({c:b[j-1],t:"miss"}); j--;
    }
  }
  return [A,B];
}
function diffWordBlock(typed,answer){
  const [A,B]=diffSeq(words(typed),words(answer),(x,y)=>normSent(x)===normSent(y));
  const row=arr=>arr.map(x=>`<span class="ch ${x.t}">${x.c?esc(x.c):"—"}</span>`).join("");
  return `<div class="diffbox">
    <div class="stack gap6"><span class="difflab">あなたの答え</span>
      <div class="chrow words">${typed?row(A):`<span class="tiny" style="font-family:var(--jp)">（未入力）</span>`}</div></div>
    <div class="stack gap6"><span class="difflab">正解</span>
      <div class="chrow words">${row(B)}</div></div>
    <p class="tiny">赤が間違い・余分な語、緑が足りなかった語です。</p>
  </div>`;
}
// 入力と正解を1文字ずつ突き合わせる（編集距離のバックトレース）
function diffChars(a,b){
  a=String(a||""); b=String(b||"");
  const m=a.length,n=b.length;
  const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) d[i][0]=i;
  for(let j=0;j<=n;j++) d[0][j]=j;
  const eqc=(x,y)=>x.toLowerCase()===y.toLowerCase();
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(eqc(a[i-1],b[j-1])?0:1));
  const A=[],B=[]; let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&d[i][j]===d[i-1][j-1]+(eqc(a[i-1],b[j-1])?0:1)){
      const e=eqc(a[i-1],b[j-1]);
      A.unshift({c:a[i-1],t:e?"eq":"sub"}); B.unshift({c:b[j-1],t:e?"eq":"sub"}); i--; j--;
    }else if(i>0&&d[i][j]===d[i-1][j]+1){
      A.unshift({c:a[i-1],t:"extra"}); B.unshift({c:"",t:"gap"}); i--;
    }else{
      A.unshift({c:"",t:"gap"}); B.unshift({c:b[j-1],t:"miss"}); j--;
    }
  }
  return [A,B];
}
function diffBlock(typed,answer){
  const [A,B]=diffChars(typed,answer);
  const row=arr=>arr.map(x=>`<span class="ch ${x.t}">${x.c?esc(x.c):"·"}</span>`).join("");
  const wrong=A.filter(x=>x.t!=="eq"&&x.t!=="gap").length+B.filter(x=>x.t==="miss").length;
  return `<div class="diffbox">
    <div class="stack gap6"><span class="difflab">あなたの入力</span>
      <div class="chrow">${typed?row(A):`<span class="tiny" style="font-family:var(--jp)">（未入力）</span>`}</div></div>
    <div class="stack gap6"><span class="difflab">正解</span>
      <div class="chrow">${row(B)}</div></div>
    <p class="tiny">赤い文字がちがうところ、緑の文字が足りなかったところ、「·」は抜けた位置です。${wrong?`ちがいは ${wrong} か所。`:""}</p>
  </div>`;
}

function clozeText(it){
  const re=new RegExp("\\b"+it.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\w*","i");
  if(re.test(it.ex)) return esc(it.ex).replace(re,'<span class="blank"></span>');
  return esc(it.ex)+' <span class="blank"></span>';
}

function answerQ(correct){
  const S=state.session; if(S.fb) return;
  const iid=S.q.it.id, sid=state.student.id, k=sid+"__"+S.bookId;
  const p=Object.assign({sid,bid:S.bookId,items:{}},mem.progress&&mem.progress[k]?JSON.parse(JSON.stringify(mem.progress[k])):{});
  p.items=p.items||{};
  p.items[iid]=applyAnswer(p.items[iid],correct,Date.now());
  const qm=S.q.mode;
  if(qm==="speak"){ p.items[iid].sok=(p.items[iid].sok||0)+(correct?1:0); p.items[iid].sng=(p.items[iid].sng||0)+(correct?0:1); }
  if(qm==="listen"||qm==="dictation"){ p.items[iid].lok=(p.items[iid].lok||0)+(correct?1:0); p.items[iid].lng=(p.items[iid].lng||0)+(correct?0:1); }
  p.updatedAt=Date.now();
  mem.progress=mem.progress||{}; mem.progress[k]=p; saveLocal();
  S.pending++;
  S.asked++;
  if(correct){S.correct++;} else {S.wrong++;}
  S.queue.shift();
  if(!correct) S.queue.splice(Math.min(3,S.queue.length),0,iid);
  S.fb={correct,it:S.q.it,mode:S.q.mode,typed:S.typed||"",target:S.q.target||"",answerWords:S.q.answerWords||null};
  S.typed="";
  if(S.pending>=8){ Store.put("progress",k,p); S.pending=0; }
  render();
  if(correct) setTimeout(()=>{ if(state.session&&state.session.fb){ nextQ(); render(); } },820);
}
function finishSession(){
  const S=state.session, sid=state.student.id, k=sid+"__"+S.bookId;
  if(mem.progress&&mem.progress[k]) Store.put("progress",k,mem.progress[k]);
  S.done=true; S.after=bookMemory(sid,S.bookId).m;
}

const FMT_W=[["mc","意味を選ぶ（4択）"],["spell","つづりを書く"],["listen","聞いて書き取る"]];
const FMT_S=[["order","語を並べかえる"],["cloze","空所を埋める"],["write","英文を書く"]];
const FMTNAME={mc:"意味を選ぶ",spell:"つづりを書く",listen:"聞いて書き取る",
  order:"語を並べかえる",cloze:"空所を埋める",write:"英文を書く",mix:"ミックス"};
const tests=()=>Object.entries(mem.tests||{}).map(([id,t])=>Object.assign({id},t)).sort((a,b)=>b.createdAt-a.createdAt);
const resultOf=(tid,sid)=>(mem.results||{})[tid+"__"+sid]||null;
const testTargets=t=>(t.studentIds&&t.studentIds.length)?t.studentIds:students().map(s=>s.id);
function testState(t){
  if(t.mode==="assign"){
    const over=t.due&&(new Date(t.due+"T23:59:59")<new Date());
    return over?"done":"live";
  }
  if(t.closedAt) return "done";
  return t.open?"live":"wait";
}
function buildTest(t){
  const b=getBook(t.bookId); if(!b) return null;
  const map={}; b.items.forEach(i=>map[i.id]=i);
  const qs=(t.itemIds||[]).map(id=>map[id]).filter(Boolean).map(it=>{
    let f=t.format;
    if(f==="mix"){ const o=(b.kind==="sentence")?["order","cloze","write"]:["mc","spell","listen"];
      f=o[Math.floor(Math.random()*o.length)]; }
    if(f==="listen"&&!TTS.ok) f="spell";
    const q={it,f};
    if(f==="mc"){ const pool=b.items.filter(x=>x.id!==it.id&&x.a!==it.a); const dis=[];
      while(dis.length<3&&pool.length) dis.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
      q.opts=dis.concat([it]).sort(()=>Math.random()-0.5); }
    if(f==="order"){ const u=words(it.q); q.units=u.map((ch,i)=>({ch,i})).sort(()=>Math.random()-0.5); q.target=u.join(" "); }
    if(f==="cloze"){ const u=words(it.q); const pool=u.map((_,i)=>i).filter(i=>u[i].length>1);
      const n=Math.min(2,pool.length), idx=[];
      while(idx.length<n&&pool.length) idx.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
      idx.sort((x,y)=>x-y); q.blanks=idx; q.answerWords=idx.map(i=>u[i]); q.wordsArr=u; }
    return q;
  });
  return {b,qs};
}
function gradeQ(q,val,picked,tiles){
  if(q.f==="mc") return picked===q.it.id;
  if(q.f==="spell"||q.f==="listen")
    return String(val||"").trim().toLowerCase().replace(/[.!?]$/,"")===String(q.it.q).toLowerCase();
  if(q.f==="write") return normSent(val)===normSent(q.it.q);
  if(q.f==="cloze"){ const g=normSent(val).split(" ").filter(Boolean), w=(q.answerWords||[]).map(normSent);
    return g.length===w.length&&g.every((x,i)=>x===w[i]); }
  if(q.f==="order") return (tiles||[]).map(x=>x.ch).join(" ")===q.target;
  return false;
}
function startTest(tid){
  const t=(mem.tests||{})[tid]; if(!t) return;
  const built=buildTest(Object.assign({id:tid},t)); if(!built){ toast("教材が見つかりません"); return; }
  const limit=t.mode==="live"?(t.limitMin||10)*60000:0;
  state.tv={tid,t:Object.assign({id:tid},t),b:built.b,qs:built.qs,idx:0,
    ans:built.qs.map(()=>({val:"",picked:"",tiles:null})),
    startedAt:Date.now(), endsAt:limit?Date.now()+limit:0, done:false, res:null};
  state.view="test"; render(); tvTick(); pushLive(true);
}
let liveT=0;
async function pushLive(force){
  const V=state.tv; if(!V||!state.student||!Store) return;
  const now=Date.now();
  if(!force&&now-liveT<1500) return;
  liveT=now;
  let correct=0,answered=0;
  const marks=V.qs.map((q,i)=>{
    const a=V.ans[i];
    const has=q.f==="mc"?!!a.picked:(q.f==="order"?!!(a.tiles&&a.tiles.length):!!String(a.val||"").trim());
    if(!has) return 0;
    answered++;
    const ok=gradeQ(q,a.val,a.picked,a.tiles);
    if(ok) correct++;
    return ok?1:2;
  });
  try{
    await Store.put("live",V.tid+"__"+state.student.id,{tid:V.tid,sid:state.student.id,
      name:state.student.name||"",room:state.student.room||"",idx:V.idx,answered,correct,
      marks,total:V.qs.length,startedAt:V.startedAt,updatedAt:now,done:!!V.done});
  }catch(e){}
}
let tvTimer=null;
function tvTick(){
  clearInterval(tvTimer);
  if(!state.tv||state.tv.done||!state.tv.endsAt) return;
  tvTimer=setInterval(()=>{
    if(!state.tv||state.tv.done){ clearInterval(tvTimer); return; }
    if(Date.now()>=state.tv.endsAt){ clearInterval(tvTimer); submitTest(true); return; }
    const el=document.getElementById("tvtimer");
    if(el){ const left=Math.max(0,state.tv.endsAt-Date.now());
      el.textContent=fmtMS(left); el.className="timer"+(left<60000?" warn":""); }
  },1000);
}
const fmtMS=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
function tvSaveCurrent(){
  const V=state.tv, q=V.qs[V.idx], a=V.ans[V.idx];
  if(q.f==="mc") return;
  const el=$("#tvin"); if(el) a.val=el.value;
}
async function submitTest(auto){
  const V=state.tv; if(!V||V.done) return;
  tvSaveCurrent();
  clearInterval(tvTimer);
  const detail=V.qs.map((q,i)=>{
    const a=V.ans[i];
    const ok=gradeQ(q,a.val,a.picked,a.tiles);
    const typed=q.f==="mc"?(a.picked?((V.b.items.find(x=>x.id===a.picked)||{}).a||""):"")
      :q.f==="order"?((a.tiles||[]).map(x=>x.ch).join(" ")):(a.val||"");
    return {iid:q.it.id,f:q.f,typed,ok:!!ok};
  });
  const score=detail.filter(d=>d.ok).length;
  V.done=true; V.res={score,total:V.qs.length,detail,auto:!!auto};
  await pushLive(true);
  const sid=state.student.id, tid=V.tid;
  await Store.put("results",tid+"__"+sid,{tid,sid,score,total:V.qs.length,detail,
    at:Date.now(),sec:Math.round((Date.now()-V.startedAt)/1000)});
  if(V.t.reflect!==false){
    const k=sid+"__"+V.t.bookId;
    const p=Object.assign({sid,bid:V.t.bookId,items:{}},
      mem.progress&&mem.progress[k]?JSON.parse(JSON.stringify(mem.progress[k])):{});
    p.items=p.items||{};
    detail.forEach(d=>{ p.items[d.iid]=applyAnswer(p.items[d.iid],d.ok,Date.now()); });
    p.updatedAt=Date.now();
    mem.progress=mem.progress||{}; mem.progress[k]=p; saveLocal();
    await Store.put("progress",k,p);
  }
  render();
}

function viewMonitor(){

  const b=getBook(t.bookId), targets=testTargets(t), now=Date.now();
  const rows=targets.map(id=>{
    const st=mem.students[id]; if(!st) return null;
    const lv=(mem.live||{})[tid+"__"+id]||null, r=resultOf(tid,id);
    const state2=r?"done":(lv?"taking":"idle");
    return {id,s:st,lv,r,st:state2};
  }).filter(Boolean);
  const nDone=rows.filter(x=>x.st==="done").length,
        nTake=rows.filter(x=>x.st==="taking").length,
        nIdle=rows.filter(x=>x.st==="idle").length;
  const subs=rows.filter(x=>x.r);
  const avg=subs.length?Math.round(subs.reduce((a,x)=>a+x.r.score/Math.max(1,x.r.total),0)/subs.length*100):0;
  const ord={taking:0,idle:1,done:2};
  rows.sort((a,c)=>ord[a.st]-ord[c.st]||((a.lv?a.lv.answered:0)-(c.lv?c.lv.answered:0)));
  // 問題別の正答率（提出済みから）
  const nq=(t.itemIds||[]).length;
  const qstat=[];
  for(let i=0;i<nq;i++){
    let ok=0,n=0;
    subs.forEach(x=>{ const d=(x.r.detail||[])[i]; if(d){n++; if(d.ok)ok++;} });
    qstat.push({i,ok,n,it:b?b.items.find(y=>y.id===(t.itemIds||[])[i]):null});
  }
  const hard=qstat.filter(x=>x.n).sort((a,c)=>(a.ok/a.n)-(c.ok/c.n)).slice(0,5);

    <div class="row" style="flex-wrap:wrap;gap:10px">

      ${t.mode==="live"&&t.open?`<button class="btn sm" data-act="test-close" data-id="${tid}">テストを終了</button>`:""}
    </div>
    <div class="stack gap6"><div class="eyebrow">授業モニター</div>
      <h2 style="font-size:21px">${esc(t.title)}</h2>
      <div class="wraprow"><span class="pill">${esc(b?b.title:"教材なし")}</span>
        ${t.unit?`<span class="pill">${esc(t.unit)}</span>`:""}
        <span class="pill">${FMTNAME[t.format]||""}</span>
        <span class="pill">${nq}問</span>
        ${t.limitMin?`<span class="pill">制限 ${t.limitMin}分</span>`:""}</div></div>
    <div class="statgrid">
      <div class="stat"><span class="k">提出済み</span><span class="v">${nDone}<small style="font-size:15px">/${rows.length}</small></span></div>
      <div class="stat"><span class="k">受験中</span><span class="v">${nTake}</span><span class="n">名</span></div>
      <div class="stat"><span class="k">未開始</span><span class="v">${nIdle}</span><span class="n">名</span></div>
      <div class="stat"><span class="k">平均正答率</span><span class="v">${avg}<small style="font-size:15px">%</small></span></div>
    </div>
    <div class="mongrid">
      ${rows.map(x=>{
        const L=x.lv, done=x.st==="done";
        const ans=done?(x.r.total):(L?L.answered:0);
        const tot=done?x.r.total:(L?L.total:nq);
        const cor=done?x.r.score:(L?L.correct:0);
        const pct=tot?Math.round(ans/tot*100):0;
        const el=L?Math.round((( done? x.r.at : now)-L.startedAt)/1000):0;
        const marks=done?(x.r.detail||[]).map(d=>d.ok?1:2):((L&&L.marks)||[]);
        return `<div class="moncard ${x.st}">
          <div class="row"><span class="nm">${esc(x.s.name)}</span><div class="spacer"></div>
            <span class="tiny">${esc(x.s.room||"")}</span></div>
          <div class="row" style="gap:8px"><span class="dot" style="background:${done?"var(--good)":x.st==="taking"?"var(--accent)":"var(--line2)"}"></span>
            <span class="tiny" style="font-weight:700">${stateName[x.st]}</span>
            <div class="spacer"></div>
            ${x.st!=="idle"?`<span class="mm">${Math.floor(el/60)}:${String(el%60).padStart(2,"0")}</span>`:""}</div>
          ${x.st==="idle"?`<p class="tiny">まだテストを開いていません</p>`:`
            <div class="bar"><i style="width:${pct}%;background:${done?"var(--good)":"var(--accent)"}"></i></div>
            <div class="row"><span class="mm">${ans} / ${tot} 問</span><div class="spacer"></div>
              <span class="heat" style="${heatStyle(ans?cor/Math.max(1,ans):0)}">正解 ${cor}</span></div>
            <div class="qbar">${Array.from({length:tot},(_,i)=>`<i class="${marks[i]===1?"ok":marks[i]===2?"ng":""}"></i>`).join("")}</div>`}
        </div>`;}).join("")}
    </div>
    ${hard.length?`<div class="card stack gap10"><div class="eyebrow">正答率の低い問題（提出済み ${subs.length} 名）</div>
      ${hard.map(h=>`<div class="row gap10">
        <span class="mm" style="width:34px">Q${h.i+1}</span>
        <span style="font-family:var(--en);font-size:15px;flex:1;min-width:0">${esc(h.it?h.it.q:"")}</span>

    </div>`:""}

  </div>`;
}

// 音読の正確さ（音声認識テキストとパッセージの語の一致率）
function ivReadScore(passage,heard){
  const norm=t=>normSay(t).split(" ").filter(Boolean);
  const want=norm(passage), got=norm(heard);
  if(!want.length||!got.length) return 0;
  const pool={}; got.forEach(w=>pool[w]=(pool[w]||0)+1);
  let hit=0;
  want.forEach(w=>{ if(pool[w]){pool[w]--;hit++;} });
  return Math.round(hit/want.length*100);
}
async function ivGrade(){
  const V=state.iv, L=IV_LEVELS.find(x=>x.k===V.lv)||IV_LEVELS[0];
  V.step="grading"; V.msg="採点しています…（20秒ほど）"; render();
  try{
    const qa=V.data.questions.map((q,i)=>`${i+1}. Q: ${q.q}\n   A: ${V.ans[i]||"(無回答)"}`).join("\n");
    const out=await SAMPLE.json(
      `あなたは英検${L.l}の面接委員です。受験者の解答を採点してください。中学生・高校生が相手なので、良い点を必ず1つは挙げ、直す点は具体的に1〜2点にしぼってください。\n`+
      `【パッセージ】${V.data.passage}\n【場面説明】${V.data.scene||""}\n`+
      `【音読の正確さ（音声認識の参考値）】${V.read==null?"未実施":V.read+"%"}\n【設問と解答】\n${qa}\n\n`+
      `出力はJSONのみ。\n`+
      `{"scores":{"attitude":0-5,"content":0-5,"grammar":0-5,"pronunciation":0-5},`+
      `"total":0-100の総合点,"summary":"日本語で2〜3文の総評",`+
      `"items":[{"no":1,"score":0-5,"comment":"日本語で1〜2文の講評","model":"英語の模範解答例（1〜2文）"}],`+
      `"advice":"次回に向けた具体的アドバイス（日本語2〜3文）"}\n`+
      `解答が空でも0点として講評と模範解答を必ず書くこと。説明文やコードフェンスは書かないこと。`,
      {modelTier:"default"});
    if(!out||!out.scores) throw new Error("形式エラー");
    V.result=out; V.step="done"; V.msg="";
    await Store.put("interviews",uid("iv_"),{sid:state.student.id,lv:V.lv,at:Date.now(),
      total:Math.round(out.total||0),scores:out.scores,summary:String(out.summary||""),read:V.read});
  }catch(e){ V.step="qa"; V.msg=aiErrMsg(e); }
  render();
}

function ivMicBox(placeholder,valId){
  const sr=ASR.ok&&!ASR.blocked, R=(state.iv.rec)||{st:"idle",text:""};
  const btn=sr?`<button class="mic ${R.st==="live"?"live":""}" data-act="iv-mic">
      ${R.st==="live"?`<span class="wave"><i></i><i></i><i></i><i></i></span>聞いています…（話し終わったらタップ）`:IC_MIC+"タップして話す"}</button>`
    :`<button class="mic ${MIC.st==="rec"?"rec":MIC.st==="done"?"done":""}" data-act="micrec">
      ${MIC.st==="rec"?`<span class="wave"><i></i><i></i><i></i><i></i></span>録音中 ${MIC.secs}秒 ・ タップで停止`
        :MIC.st==="done"?IC_MIC+"もう一度 録音する":IC_MIC+"タップして録音する"}</button>
      ${MIC.st==="done"&&MIC.url?`<div class="recbox"><audio controls src="${MIC.url}"></audio></div>`:""}
      ${MIC.err?`<p class="tiny ng">${esc(MIC.err)}</p>`:""}`;
  return `${btn}
    <textarea id="${valId}" rows="3" placeholder="${esc(placeholder)}">${esc(R.text||"")}</textarea>
    <p class="tiny">${sr?"認識された文はここで直せます。":"この環境では自動の文字起こしができません。録音を聞き返しながら、話した内容を英語で入力してください（採点はこの文で行います）。"}</p>`;
}

        <p class="ivpassage">${esc(V.data.passage)}</p>

      <div class="stack gap8">${ivMicBox("読み上げた英文（マイクが使えない場合はスキップで構いません）","ivread")}</div>
      ${V.read!=null?`<div class="card stack gap8"><div class="eyebrow">音読の正確さ</div>
        <div class="row gap10"><div class="bar" style="flex:1"><i style="width:${V.read}%"></i></div>
        <span class="mono" style="font-weight:700">${V.read}%</span></div>

      <div class="row gap8"><button class="btn pri big" data-act="iv-readdone" style="flex:1">読み終えた → 質問へ</button></div>

  if(V.step==="qa"||V.step==="grading"){

  // 結果
  const R=V.result||{}, sc=R.scores||{};
  return `<div class="wrap stack gap20">${head}
    <div class="card stack gap14" style="text-align:center">

      <p class="muted" style="text-align:left">${esc(R.summary||"")}</p>

      ${IV_ASPECT.map(a=>{const v=Math.max(0,Math.min(5,Number(sc[a[0]])||0));

          <span class="n">${v} / 5</span></div>`;}).join("")}
      ${V.read!=null?`<div class="scorebar"><span class="tiny" style="font-weight:700">音読一致率</span>
        <div class="bar"><i style="width:${V.read}%"></i></div><span class="n">${V.read}%</span></div>`:""}
    </div>
    <div class="stack gap12"><div class="eyebrow">設問ごとの講評</div>
      ${(R.items||[]).map((it,i)=>{const q=V.data.questions[i]||{};
        return `<div class="card stack gap8">
          <div class="row"><b style="font-size:14px">Q${i+1}</b><div class="spacer"></div>

          <div class="qa stack gap6">

          <p class="muted">${esc(it.comment||"")}</p>
          ${it.model?`<div class="stack gap6"><div class="eyebrow">模範解答の例</div>
            <div class="row gap8"><div class="model" style="flex:1">${esc(it.model)}</div>${spkBtn(it.model,"sm")}</div></div>`:""}

function tabStudents(){
  const ss=students(), allBooks=books(), now=Date.now();
  const bs=allBooks.filter(b=>ss.some(s=>Object.keys(getProg(s.id,b.id).items||{}).length))
    .concat(allBooks.filter(b=>!ss.some(s=>Object.keys(getProg(s.id,b.id).items||{}).length)).slice(0,0));
  if(state.detail) return studentDetail(state.detail);
  let all=0,cnt=0,active=0;
  ss.forEach(s=>{ let last=0;
    bs.forEach(b=>{const r=bookMemory(s.id,b.id); if(r.total){all+=r.m;cnt++;}
      const p=getProg(s.id,b.id); if(p.updatedAt>last)last=p.updatedAt;});
    if(now-last<3*DAY) active++; });
  return `<div class="stack gap14">
    <div class="statgrid">
      <div class="stat"><span class="k">在籍</span><span class="v">${ss.length}</span><span class="n">名</span></div>
      <div class="stat"><span class="k">平均記憶度</span><span class="v">${cnt?Math.round(all/cnt*100):0}<small style="font-size:15px">%</small></span><span class="n">全教材の平均</span></div>
      <div class="stat"><span class="k">3日以内に学習</span><span class="v">${active}</span><span class="n">/ ${ss.length} 名</span></div>
      <div class="stat"><span class="k">教材</span><span class="v">${allBooks.length}</span><span class="n">冊 ・ ${allBooks.reduce((a,b)=>a+b.items.length,0)} 語</span></div>
    </div>
    ${lvStatsBlock(ss.map(x=>x.id),"英検レベル別の定着（塾全体）")}
    <div class="wraprow">${STATES.map(x=>`<span class="lvchip"><i style="background:${x.c}"></i>${x.l}<span class="tiny">（${x.d}）</span></span>`).join("")}</div>
    ${lvLegend()}
    <div class="row"><h2 style="font-size:17px">生徒ごとの記憶度</h2><div class="spacer"></div>
      <button class="btn sm" data-act="accounts">ログイン情報の一覧</button>
      <button class="btn sm" data-act="add-student">生徒を追加</button></div>
    <div class="tablewrap"><table><thead><tr>
      <th>生徒</th><th>教室</th>${bs.length?bs.map(b=>`<th>${esc(b.title)}</th>`).join(""):"<th>教材</th>"}<th>記憶レベル内訳</th><th>最終学習</th><th>ID / パスコード</th><th></th></tr></thead>
      <tbody>${ss.length?ss.map(s=>{
        let last=0; bs.forEach(b=>{const p=getProg(s.id,b.id); if(p.updatedAt>last)last=p.updatedAt;});
        return `<tr><td><b>${esc(s.name)}</b> <span class="tiny">${esc(s.grade||"")}</span></td>
        <td class="tiny">${esc(s.room||"")}</td>
        ${bs.length?bs.map(b=>{const r=bookMemory(s.id,b.id);const p=getProg(s.id,b.id);
          const has=Object.keys(p.items||{}).length;
          return `<td>${has?`<span class="heat" style="${heatStyle(r.m)}">${Math.round(r.m*100)}%</span> <span class="tiny mono">${r.learned}/${r.total}</span>`:`<span class="tiny">—</span>`}</td>`;}).join(""):`<td class="tiny">未学習</td>`}
        <td style="min-width:120px">${(function(){const cc=stateCounts(s.id),t=cc.total||1;
          return `<div class="seg" title="記憶済み${cc.done} / 記憶中${cc.learn} / 弱点${cc.weak} / 不明${cc.unknown}">${STATES.map(x=>cc[x.k]?`<i style="width:${cc[x.k]/t*100}%;background:${x.c}"></i>`:"").join("")}</div>`;})()}</td>
        <td class="tiny mono">${last?fmtAgo(now-last):"—"}</td>
        <td class="tiny mono">${esc(s.loginId||"—")} / ${esc(s.pin||"—")}</td>
        <td><button class="btn sm ghost" data-act="detail" data-id="${s.id}">詳細</button></td></tr>`;}).join(""):
        `<tr><td colspan="${bs.length+6}"><p class="empty">生徒が登録されていません。</p></td></tr>`}
      </tbody></table></div>
    <p class="tiny">記憶度は「いま出題したら正解できる確率」の推定値です。最後に学習してからの経過時間で自動的に下がります。</p>
  </div>`;
}
function fmtAgo(ms){ const d=Math.floor(ms/DAY); if(d<=0)return "今日"; if(d===1)return "昨日"; if(d<30)return d+"日前"; return Math.floor(d/30)+"か月前"; }

function studentDetail(sid){
  const s=mem.students[sid]; if(!s){state.detail=null;return tabStudents();}
  const bs=books(), now=Date.now();
  const weak=[];
  bs.forEach(b=>{ const p=getProg(sid,b.id);
    b.items.forEach(it=>{ const rec=p.items[it.id]; if(!rec||!rec.seen) return;
      weak.push({b:b.title,it,m:memoryOf(rec,now),rec}); }); });
  weak.sort((a,b)=>a.m-b.m);
  let sok=0,sng=0,lok=0,lng=0;
  weak.forEach(w=>{sok+=w.rec.sok||0;sng+=w.rec.sng||0;lok+=w.rec.lok||0;lng+=w.rec.lng||0;});
  const tot=weak.length, avg=tot?weak.reduce((a,x)=>a+x.m,0)/tot:0;
  return `<div class="stack gap14">
    <div class="row"><button class="btn ghost sm" data-act="back">← 一覧</button></div>
    <div class="card row gap14">${ring(avg,"lg")}
      <div class="stack gap6"><div class="eyebrow">${esc(s.room||"")} ${esc(s.grade||"")}</div>
      <h2 style="font-size:21px">${esc(s.name)}</h2>
      <p class="muted">学習済み <span class="mono">${tot}</span> 語 / 定着 <span class="mono">${weak.filter(w=>w.m>=0.9).length}</span> 語</p></div></div>
    <div class="card row gap10" style="padding:12px 14px">
      ${(function(){const d=districtOf(s);
        return d?`<span class="pill acc">${esc(s.school||DISTRICTS[d].name)}</span>
          <span class="tiny">${esc(DISTRICTS[d].name)}・教科書 <b>${esc(DISTRICTS[d].tb)}</b>（${esc(DISTRICTS[d].pub)}）</span>`
        :`<span class="tiny">中学校が未設定です。設定すると地区に合った教科書の単語だけが出ます。</span>`;})()}
      <div class="spacer"></div>
      <button class="btn sm" data-act="school-open" data-id="${sid}">学校を設定</button></div>
    <div class="card donutwrap">${donut(stateCounts(sid),210)}${stateLegend(stateCounts(sid),false)}</div>
    ${(function(){
      const iv=Object.values(mem.interviews||{}).filter(x=>x.sid===sid).sort((a,b)=>b.at-a.at).slice(0,6);
      if(!iv.length) return "";
      return `<div class="card stack gap10"><div class="eyebrow">英検 面接練習の履歴</div>
        ${iv.map(x=>`<div class="row gap10" style="border-bottom:1px solid var(--line);padding-bottom:8px">
          <span class="lvchip"><i style="background:${lvColor(x.lv)}"></i>${LVL[x.lv]||""}</span>
          <span class="tiny mono">${new Date(x.at).toLocaleDateString("ja-JP")}</span>
          <span class="grow tiny" style="flex:1;min-width:0">${esc(x.summary||"")}</span>
          <span class="heat" style="${heatStyle((x.total||0)/100)}">${Math.round(x.total||0)}点</span></div>`).join("")}
      </div>`;})()}
    <div class="statgrid">
      <div class="stat"><span class="k">発音チェック</span><span class="v">${(sok+sng)?Math.round(sok/(sok+sng)*100):0}<small style="font-size:15px">%</small></span><span class="n">${sok} / ${sok+sng} 回</span></div>
      <div class="stat"><span class="k">リスニング</span><span class="v">${(lok+lng)?Math.round(lok/(lok+lng)*100):0}<small style="font-size:15px">%</small></span><span class="n">${lok} / ${lok+lng} 回</span></div>
      <div class="stat"><span class="k">学習済み</span><span class="v">${tot}</span><span class="n">語</span></div>
    </div>
    ${lvStatsBlock([sid],"英検レベル別の定着")}
    <h3 style="font-size:16px">つまずいている単語（記憶度の低い順）</h3>
    <div class="tablewrap"><table><thead><tr><th>単語</th><th>級</th><th>意味</th><th>記憶度</th><th>正/誤</th><th>教材</th></tr></thead>
      <tbody>${weak.slice(0,25).map(w=>`<tr>
        <td style="font-family:var(--en);font-size:16px">${esc(w.it.q)}</td>
        <td>${lvChip(lvOf(w.it))}</td>
        <td>${esc(w.it.a)}</td>
        <td><span class="heat" style="${heatStyle(w.m)}">${Math.round(w.m*100)}%</span></td>
        <td class="mono tiny">${w.rec.ok} / ${w.rec.ng}</td>
        <td class="tiny">${esc(w.b)}</td></tr>`).join("")||`<tr><td colspan="6"><p class="empty">まだ学習記録がありません。</p></td></tr>`}
      </tbody></table></div></div>`;
}

function tabTests(){
  const ts=tests();

        </div>
        <div class="wraprow">

          <tbody>${rows.slice().sort((x,y)=>{

            .map(x=>`<tr><td><b>${esc(x.s.name)}</b></td><td class="tiny">${esc(x.s.room||"")}</td>

function mdPick(bid){
  const b=getBook(bid); if(!b) return "";
  const mode=state.pickMode||"std";
  const us=bookUnits(b), pu=state.pickUnit||"";
  const modes=[["std","読む・書く","4択・並べ替え・つづり"],["listen","聞く","音声を聞いて答える"],["speak","話す","声に出して発音する"]];
  const sid=state.student.id, p=getProg(sid,bid), now=Date.now();
  const src=pu?b.items.filter(it=>unitOf(it)===pu):b.items;
  const g={}; src.forEach(it=>{const k=lvOf(it)||"?"; (g[k]=g[k]||[]).push(it);});
  const stat=list=>{let sum=0,weak=0; list.forEach(it=>{const m=memoryOf(p.items[it.id],now); sum+=m; if(m<0.85)weak++;});
    return {m:list.length?sum/list.length:0,weak,n:list.length};};
  const row=(key,label,dot,list)=>{const r=stat(list);
    return `<button class="btn big" data-act="go" data-id="${bid}" data-lv="${key}" data-mode="${mode}" data-u="${esc(pu)}" style="justify-content:space-between;text-align:left">
      <span class="row" style="gap:8px">${dot}<span>${label}</span><span class="tiny">${r.n}語</span></span>
      <span class="mono tiny">記憶度 ${Math.round(r.m*100)}% ・要復習 ${r.weak}</span></button>`;};
  return `<div class="stack gap14"><h3>${esc(b.title)}</h3>
    <div class="stack gap8"><div class="eyebrow">学習モード</div>
      <div class="pickgrid">${modes.map(m=>`<button class="pick" data-act="pmode" data-id="${bid}" data-m="${m[0]}"
        style="${mode===m[0]?"border-color:var(--accent);background:var(--accent-soft)":""}">
        <b>${m[1]}</b><span>${m[2]}</span></button>`).join("")}</div>
      ${(mode!=="std"&&!TTS.ok)?`<p class="tiny ng">この端末では音声読み上げが使えません。</p>`:""}
      ${(mode==="speak"&&(!ASR.ok||ASR.blocked))?`<p class="tiny">この端末では音声認識が使えないため、自己採点モードになります。</p>`:""}
    </div>
    ${us.length?`<div class="stack gap8"><div class="eyebrow">単元</div>
      <div class="wraprow"><button class="btn sm ${pu?"":"pri"}" data-act="punit" data-id="${bid}" data-u="">すべて</button>
      ${us.map(u=>`<button class="btn sm ${pu===u?"pri":""}" data-act="punit" data-id="${bid}" data-u="${esc(u)}">${esc(u)}</button>`).join("")}</div></div>`:""}
    <p class="muted">出題する範囲を選びます。要復習＝記憶度が85%を切っている語。</p>
    <div class="stack gap8">
      ${row("","すべて",'<i style="width:9px;height:9px;border-radius:3px;background:var(--accent);display:inline-block"></i>',src)}
      ${LEVELS.filter(L=>g[L.k]).map(L=>row(L.k,L.l+`<span class="tiny">（${L.d}）</span>`,`<i style="width:9px;height:9px;border-radius:3px;background:${lvColor(L.k)};display:inline-block"></i>`,g[L.k])).join("")}
      ${g["?"]?row("?","未分類",'<i style="width:9px;height:9px;border-radius:3px;background:var(--line2);display:inline-block"></i>',g["?"]):""}
    </div>
    <div class="row"><div class="spacer"></div><button class="btn ghost" data-act="close">閉じる</button></div></div>`;
}

/* ---------- CSV ---------- */
function parseRows(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.includes("\t")?l.split("\t"):l.split(",");
    const c=n=>(parts[n]||"").trim().replace(/^"|"$/g,"");
    return {q:c(0),a:c(1),ex:c(2),lv:normLv(c(3))};
  }).filter(r=>r.q&&r.a).map((r,i)=>({id:"i"+i+"_"+r.q.replace(/[^a-zA-Z0-9]/g,"").slice(0,16),q:r.q,a:r.a,ex:r.ex,lv:r.lv||guessLevel(r.q)}));
}
